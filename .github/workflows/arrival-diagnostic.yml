name: Temporary arrival diagnosis
on:
  push:
    branches: [fix/search-state-transition-qa]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/arrival-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/arrival-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Diagnose published arrival directly
        env:
          NODE_PATH: ${{ runner.temp }}/arrival-tools/node_modules
        run: |
          node -e "const {chromium}=require('playwright');(async()=>{const browser=await chromium.launch();try{await require('./tests/arrival-browser.cjs')({browser,origin:'https://richardhan.github.io/ai-agent-use-cases/',prefix:'live-diagnostic',sizes:[['desktop',1440,1000],['mobile',390,844],['small-mobile',320,740]]});}finally{await browser.close();}})().catch(e=>{console.error(e);process.exitCode=1;});"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arrival-diagnostic-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 14
