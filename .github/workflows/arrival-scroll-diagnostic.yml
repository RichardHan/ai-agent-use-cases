name: Arrival scroll diagnostic
on:
  push:
    branches: [test/arrival-scroll-diagnostics]
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install existing cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/scroll-tools" playwright@1.64.1
          "$RUNNER_TEMP/scroll-tools/node_modules/.bin/playwright" install --with-deps firefox
          sudo apt-get install -y fonts-noto-cjk
      - name: Compare original and current application
        env:
          NODE_PATH: ${{ runner.temp }}/scroll-tools/node_modules
        run: |
          git worktree add --detach "$RUNNER_TEMP/scroll-before" ee1bfcedf832b5c933ea3a69c3a34b1d788b7667
          python3 "$RUNNER_TEMP/scroll-before/scripts/preview.py" "$RUNNER_TEMP/scroll-before-preview/ai-agent-use-cases"
          python3 scripts/preview.py "$RUNNER_TEMP/scroll-after-preview/ai-agent-use-cases"
          python3 -m http.server 8093 --directory "$RUNNER_TEMP/scroll-before-preview" > /tmp/scroll-before.log 2>&1 &
          python3 -m http.server 8094 --directory "$RUNNER_TEMP/scroll-after-preview" > /tmp/scroll-after.log 2>&1 &
          node tests/arrival-scroll-diagnostic.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: arrival-scroll-diagnostic
          path: qa-artifacts/
          retention-days: 30
