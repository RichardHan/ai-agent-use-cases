name: Available facet options QA
on:
  push:
    branches: ['improve/available-facets-20261021', 'main']
    paths: ['assets/app.js', 'tests/available-facets-browser.cjs', '.github/workflows/available-facets-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/facet-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/facet-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit, syntax and static previews
        shell: bash
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs | tee qa-artifacts/unit.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/facet-preview/ai-agent-use-cases"
          mkdir -p "$RUNNER_TEMP/facet-before"
          git archive 72b7ff9 | tar -x -C "$RUNNER_TEMP/facet-before"
          python3 "$RUNNER_TEMP/facet-before/scripts/preview.py" "$RUNNER_TEMP/facet-before-preview/ai-agent-use-cases"
          python3 -m http.server 8136 --directory "$RUNNER_TEMP/facet-preview" > /tmp/facet-preview.log 2>&1 &
          python3 -m http.server 8137 --directory "$RUNNER_TEMP/facet-before-preview" > /tmp/facet-before.log 2>&1 &
      - name: Baseline screenshots and three complete journeys
        env:
          NODE_PATH: ${{ runner.temp }}/facet-tools/node_modules
        run: |
          FACETS_OBSERVE=1 FACETS_URL=http://127.0.0.1:8137/ai-agent-use-cases/ FACETS_OUTPUT=qa-artifacts/before node tests/available-facets-browser.cjs
          node tests/available-facets-browser.cjs
          SORT_URL=http://127.0.0.1:8136/ai-agent-use-cases/ node tests/sort-reset-browser.cjs
      - name: Published site verification
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/facet-tools/node_modules
          FACETS_URL: https://richardhan.github.io/ai-agent-use-cases/
          FACETS_OUTPUT: qa-artifacts/published
          FACETS_LIVE: '1'
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          (async()=>{
            for(let i=0;i<181;i++){
              const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
              const r=await fetch(process.env.FACETS_URL+'assets/app.js?facetqa='+Date.now(),{cache:'no-store'});
              if(r.ok&&await r.text()===fs.readFileSync('assets/app.js','utf8'))return;
              await new Promise(r=>setTimeout(r,5000));
            }
            const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
            throw Error('Published app.js differs from checkout within 15 minutes (181 attempts)');
          })().catch(e=>{console.error(e);process.exitCode=1});
          JS
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/available-facets-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: available-facets-${{ github.run_id }}
          path: qa-artifacts/
