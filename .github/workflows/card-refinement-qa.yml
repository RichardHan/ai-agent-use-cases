name: Card refinement QA
on:
  push:
    branches: [feat/source-aware-reading, main]
    paths: ['assets/**', 'tests/**', '.github/workflows/card-refinement-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refinement:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and static build
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/refine-preview/ai-agent-use-cases"
      - name: Install cloud-only browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/refine-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/refine-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Walk current published baseline
        env:
          NODE_PATH: ${{ runner.temp }}/refine-tools/node_modules
          REFINE_URL: https://richardhan.github.io/ai-agent-use-cases/
          OBSERVE: '1'
        run: node tests/card-refinement-browser.cjs
      - name: Verify updated refinement
        if: ${{ hashFiles('tests/card-refinement.test.cjs') != '' }}
        env:
          NODE_PATH: ${{ runner.temp }}/refine-tools/node_modules
        run: |
          python3 -m http.server 8093 --directory "$RUNNER_TEMP/refine-preview" > /tmp/refine-preview.log 2>&1 &
          node tests/card-refinement-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
