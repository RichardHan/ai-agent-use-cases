name: Card refinement QA
on:
  push:
    branches: [feat/source-aware-reading, main]
    paths: ['assets/**', 'tests/**', '.github/workflows/card-refinement-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refinement:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and static build
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/refine-preview/ai-agent-use-cases"
      - name: Install cloud-only browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/refine-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/refine-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Walk current published baseline
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          NODE_PATH: ${{ runner.temp }}/refine-tools/node_modules
          REFINE_URL: https://richardhan.github.io/ai-agent-use-cases/
          OBSERVE: '1'
        run: node tests/card-refinement-browser.cjs
      - name: Verify updated refinement
        if: ${{ hashFiles('tests/card-refinement.test.cjs') != '' }}
        env:
          NODE_PATH: ${{ runner.temp }}/refine-tools/node_modules
        run: |
          python3 -m http.server 8093 --directory "$RUNNER_TEMP/refine-preview" > /tmp/refine-preview.log 2>&1 &
          node tests/card-refinement-browser.cjs
      - name: Preserve existing reader and homepage flows
        if: ${{ hashFiles('tests/card-refinement.test.cjs') != '' }}
        env:
          NODE_PATH: ${{ runner.temp }}/refine-tools/node_modules
          READER_URL: http://127.0.0.1:8093/ai-agent-use-cases/
          SEARCH_ENTRY_URL: http://127.0.0.1:8093/ai-agent-use-cases/
        run: |
          node tests/reader-browser.cjs > /tmp/refine-reader.log 2>&1 || { tail -c 8000 /tmp/refine-reader.log; exit 1; }
          node tests/home-search-entry-browser.cjs > /tmp/refine-entry.log 2>&1 || { tail -c 8000 /tmp/refine-entry.log; exit 1; }
      - name: Wait for and verify published improvement
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          NODE_PATH: ${{ runner.temp }}/refine-tools/node_modules
          REFINE_URL: https://richardhan.github.io/ai-agent-use-cases/
          REFINE_LABEL: published
        run: |
          node <<'NODE'
          const {waitForPublishedAssets}=require('./scripts/published-assets.cjs');
          (async()=>{
            const result=await waitForPublishedAssets({
              base:process.env.REFINE_URL,
              sha:process.env.GITHUB_SHA,
              files:['assets/app.js','assets/style.css']
            });
            if(result==='superseded'){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
            console.log('PUBLISHED_ASSETS_MATCH '+process.env.GITHUB_SHA);
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/card-refinement-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refinement-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
