name: Case sharing QA
on:
  push:
    branches: ['improve/reader-next-step-20261021', 'verify/case-share-published-20261021', 'main']
    paths: ['assets/**', 'tests/case-share*', '.github/workflows/case-share-qa.yml']
  workflow_dispatch:
    inputs:
      published_only:
        description: 'Verify unchanged published assets and journeys without repeating preview suites'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/share-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/share-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Baseline unit, syntax and static preview
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs | tee qa-artifacts/unit.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/share-preview/ai-agent-use-cases"
      - name: Reproduce old unit failure and start static preview
        if: inputs.published_only != true && github.ref != 'refs/heads/verify/case-share-published-20261021'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/share-before"
          git archive 1a704e7 | tar -x -C "$RUNNER_TEMP/share-before"
          cp tests/case-share.test.cjs "$RUNNER_TEMP/share-before/tests/"
          if node --test "$RUNNER_TEMP/share-before/tests/case-share.test.cjs" > qa-artifacts/red-unit.tap 2>&1; then
            echo 'Expected old URL-sharing tests to fail'; exit 1
          fi
          python3 -m http.server 8140 --directory "$RUNNER_TEMP/share-preview" > /tmp/share-preview.log 2>&1 &
          python3 -m http.server 8081 --directory "$RUNNER_TEMP/share-preview" > /tmp/share-discovery.log 2>&1 &
          curl --retry 5 --retry-connrefused --retry-delay 1 --fail http://127.0.0.1:8140/ai-agent-use-cases/ > /dev/null
      - name: Five browser configurations, clipboard states and existing regressions
        if: inputs.published_only != true && github.ref != 'refs/heads/verify/case-share-published-20261021'
        env:
          NODE_PATH: ${{ runner.temp }}/share-tools/node_modules
          SHARE_URL: http://127.0.0.1:8140/ai-agent-use-cases/
          SHARE_OUTPUT: qa-artifacts/share-after
          READER_URL: http://127.0.0.1:8140/ai-agent-use-cases/
          SUBMIT_URL: http://127.0.0.1:8140/ai-agent-use-cases/
        run: |
          node tests/case-share-browser.cjs
          node tests/discovery-browser.cjs
          node tests/reader-browser.cjs
          node tests/search-submit-browser.cjs
      - name: Published assets and desktop/mobile journeys
        if: github.ref == 'refs/heads/main' || inputs.published_only == true || github.ref == 'refs/heads/verify/case-share-published-20261021'
        env:
          NODE_PATH: ${{ runner.temp }}/share-tools/node_modules
          SHARE_URL: https://richardhan.github.io/ai-agent-use-cases/
          SHARE_OUTPUT: qa-artifacts/share-published
          SHARE_LIVE: '1'
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const {isCurrentMainCommit}=require('./scripts/published-check.cjs');
          (async()=>{
          if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
            const files=['assets/app.js','assets/style.css'];
            for(let i=0;i<84;i++){
              const matches=await Promise.all(files.map(async file=>{const r=await fetch(process.env.SHARE_URL+file+'?shareqa='+Date.now(),{cache:'no-store'});return r.ok&&await r.text()===fs.readFileSync(file,'utf8');}));
              if(matches.every(Boolean)){fs.writeFileSync('qa-artifacts/published-assets.json',JSON.stringify({sha:process.env.GITHUB_SHA,files,matched:true}));return;}
              await new Promise(r=>setTimeout(r,5000));
            }
            throw Error('Published assets differ from checkout');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/case-share-browser.cjs
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict');
          const rows=JSON.parse(fs.readFileSync(process.env.SHARE_OUTPUT+'/report.json','utf8'));
          assert.deepEqual(rows.map(r=>r.width),[1440,390]);
          for(const row of rows){assert.equal(row.completed,true);assert.equal(row.journeys.length,3);assert.equal(row.audits.length,3);}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: case-share-${{ github.run_id }}
          path: qa-artifacts/
