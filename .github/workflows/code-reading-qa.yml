name: Transient loading round QA
on:
  push:
    branches: [improve/reader-code-blocks-20261023]
  workflow_dispatch:
    inputs:
      target:
        description: Browser target
        type: choice
        options: [preview, published]
        default: preview
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts qa-artifacts
          curl -fL --max-time 90 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
      - name: Unit, syntax and preview build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --test --test-reporter=tap tests/*.test.cjs > qa-artifacts/unit.tap 2>&1
          for f in assets/*.js tests/transient-loading*.cjs; do node --check "$f"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          git show 3494ed9:assets/app.js > "$RUNNER_TEMP/before-app.js"
      - name: Compare same-corpus transient failure and verify recovery
        if: inputs.target != 'published'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          BEFORE_APP: ${{ runner.temp }}/before-app.js
          SITE_URL: http://127.0.0.1:8178/ai-agent-use-cases/
        run: |
          python3 -m http.server 8178 --directory "$RUNNER_TEMP/preview" > /tmp/transient-preview.log 2>&1 &
          chown -R pwuser:pwuser qa-artifacts
          QA_BEFORE=1 QA_OUT=qa-artifacts/before runuser -u pwuser -- node tests/transient-loading-browser.cjs
          QA_OUT=qa-artifacts/after runuser -u pwuser -- node tests/transient-loading-browser.cjs
      - name: Existing reading and lifecycle regression
        if: inputs.target != 'published'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SITE_URL: http://127.0.0.1:8178/ai-agent-use-cases/
          QA_OUT: qa-artifacts/regression
        run: runuser -u pwuser -- node tests/page-context-browser.cjs > qa-artifacts/regression.log 2>&1
      - name: Verify published assets and three reading scenarios
        if: inputs.target == 'published'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          chown -R pwuser:pwuser qa-artifacts
          runuser -u pwuser -- node tests/transient-loading-published.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: code-reading-qa
          path: qa-artifacts/
