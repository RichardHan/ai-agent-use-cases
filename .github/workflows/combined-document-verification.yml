name: Combined document verification
on:
  push:
    branches: [verify/combined-recovery-document]
permissions:
  contents: read
jobs:
  firefox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud Firefox tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps firefox
          sudo apt-get install -y fonts-noto-cjk
      - name: Replay exact Firefox journey once with document diagnostics
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          RECOVERY_URL: https://richardhan.github.io/ai-agent-use-cases/
          RECOVERY_FIREFOX_ONLY: '1'
        run: node tests/combined-recovery-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-document-verification
          path: qa-artifacts/
          retention-days: 30
