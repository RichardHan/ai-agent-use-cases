name: Combined recovery QA
on:
  push:
    branches: [improve/search-clear-control, main]
    paths: ['assets/**', 'tests/combined-recovery*', '.github/workflows/combined-recovery-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests, syntax and static preview
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/recovery-preview/ai-agent-use-cases"
      - name: Reproduce the missing recovery on the original baseline
        run: |
          mkdir -p qa-artifacts
          git show 0f6153f:assets/app.js > "$RUNNER_TEMP/recovery-before.js"
          if RECOVERY_SOURCE="$RUNNER_TEMP/recovery-before.js" node --test tests/combined-recovery.test.cjs > qa-artifacts/red-baseline.tap 2>&1; then
            echo 'Expected missing combined recovery to fail'
            exit 1
          fi
          grep -q 'combinedRelaxationOptions is not defined' qa-artifacts/red-baseline.tap
      - name: Cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/recovery-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/recovery-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Inspect published baseline
        if: github.ref != 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/recovery-tools/node_modules
          RECOVERY_URL: https://richardhan.github.io/ai-agent-use-cases/
          OBSERVE: '1'
        run: node tests/combined-recovery-browser.cjs
      - name: Verify updated preview
        if: ${{ hashFiles('tests/combined-recovery.test.cjs') != '' }}
        env:
          NODE_PATH: ${{ runner.temp }}/recovery-tools/node_modules
        run: |
          python3 -m http.server 8099 --directory "$RUNNER_TEMP/recovery-preview" > /tmp/recovery-preview.log 2>&1 &
          node tests/combined-recovery-browser.cjs
      - name: Verify published assets and journeys
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/recovery-tools/node_modules
          RECOVERY_URL: https://richardhan.github.io/ai-agent-use-cases/
        run: |
          node <<'NODE'
          const {waitForPublishedAssets}=require('./scripts/published-assets.cjs');
          waitForPublishedAssets({base:process.env.RECOVERY_URL,sha:process.env.GITHUB_SHA,files:['assets/app.js']})
            .then(result=>console.log(result==='matched'?'PUBLISHED_ASSETS_MATCH '+process.env.GITHUB_SHA:'SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA))
            .catch(e=>{console.error(e);process.exitCode=1});
          NODE
          mkdir -p qa-artifacts/preview
          mv qa-artifacts/after-* qa-artifacts/preview/
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/combined-recovery-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-recovery-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
