name: Combined recovery QA
on:
  push:
    branches: [improve/search-clear-control]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests, syntax and static preview
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/recovery-preview/ai-agent-use-cases"
      - name: Cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/recovery-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/recovery-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Inspect published baseline
        env:
          NODE_PATH: ${{ runner.temp }}/recovery-tools/node_modules
          RECOVERY_URL: https://richardhan.github.io/ai-agent-use-cases/
          OBSERVE: '1'
        run: node tests/combined-recovery-browser.cjs
      - name: Verify updated preview
        if: ${{ hashFiles('tests/combined-recovery.test.cjs') != '' }}
        env:
          NODE_PATH: ${{ runner.temp }}/recovery-tools/node_modules
        run: |
          python3 -m http.server 8099 --directory "$RUNNER_TEMP/recovery-preview" > /tmp/recovery-preview.log 2>&1 &
          node tests/combined-recovery-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: combined-recovery-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
