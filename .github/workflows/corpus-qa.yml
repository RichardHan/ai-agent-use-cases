name: Corpus loading QA
on:
  push:
    branches: [feat/corpus-loading]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and syntax
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/corpus-preview/ai-agent-use-cases"
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/corpus-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/corpus-tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Walk and measure published baseline
        env:
          NODE_PATH: ${{ runner.temp }}/corpus-tools/node_modules
          CORPUS_LABEL: before
        run: node tests/corpus-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: corpus-loading-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
