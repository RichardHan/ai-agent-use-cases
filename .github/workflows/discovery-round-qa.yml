name: Discovery improvement round QA
on:
  push:
    branches: [improve/actionable-discovery-20261022, verify/actionable-discovery-20261022]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Observe current website
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node tests/discovery-round-observe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-round-qa
          path: qa-artifacts/
