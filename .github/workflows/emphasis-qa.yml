name: Source emphasis QA
on:
  push:
    branches: [improve/reading-source-links-20261023, verify/source-emphasis-20261023]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts qa-artifacts
          curl -fL --max-time 90 --retry 1 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          chown -R pwuser:pwuser qa-artifacts
      - name: Baseline checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --test --test-reporter=tap tests/*.test.cjs > qa-artifacts/unit.tap 2>&1
          for f in assets/*.js tests/emphasis*.cjs; do node --check "$f"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Observe published site
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          QA_OBSERVE: '1'
        run: runuser -u pwuser -- node tests/emphasis-browser.cjs
      - name: Reproduce baseline and verify preview
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          git show 9ebbcb2:assets/app.js > "$RUNNER_TEMP/before-app.js"
          if EMPHASIS_SOURCE="$RUNNER_TEMP/before-app.js" node --test --test-reporter=tap tests/emphasis.test.cjs > qa-artifacts/red.tap 2>&1; then
            echo 'Expected baseline emphasis regression'; exit 1
          fi
          node -e "const fs=require('node:fs'),a=require('node:assert/strict'),s=fs.readFileSync('qa-artifacts/red.tap','utf8');a.match(s,/# fail 3/);a.equal([...s.matchAll(/code: 'ERR_ASSERTION'/g)].length,3)"
          python3 -m http.server 8174 --directory "$RUNNER_TEMP/preview" > /tmp/emphasis-preview.log 2>&1 &
          chown -R pwuser:pwuser qa-artifacts
          SITE_URL=http://127.0.0.1:8174/ai-agent-use-cases/ QA_OUT=qa-artifacts/after runuser -u pwuser -- node tests/emphasis-browser.cjs
      - name: Existing full reading and lifecycle regressions
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SITE_URL: http://127.0.0.1:8174/ai-agent-use-cases/
          QA_OUT: qa-artifacts/regression
        run: runuser -u pwuser -- node tests/page-context-browser.cjs > qa-artifacts/regression.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-emphasis-qa
          path: qa-artifacts/
