name: Evidence round QA
on:
  push:
    branches: [improve/reader-evidence-navigation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and build
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Browser tools in authorized cloud
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Inspect published journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READING_URL: https://richardhan.github.io/ai-agent-use-cases/
          READING_OBSERVE: '1'
        run: node tests/reading-flow-browser.cjs > /tmp/observe.log 2>&1 || { tail -c 4000 /tmp/observe.log; exit 1; }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-round
          path: qa-artifacts/
          retention-days: 30
