name: Evidence round QA
on:
  push:
    branches: [improve/reader-evidence-navigation, main]
    paths: ['assets/reader.*', 'tests/review-sections*', '.github/workflows/evidence-round-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and build
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Browser tools in authorized cloud
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Reproduce missing later-version index on baseline
        run: |
          git show 7b1b36a:assets/reader.js > "$RUNNER_TEMP/review-before.js"
          mkdir -p qa-artifacts
          if REVIEW_SOURCE="$RUNNER_TEMP/review-before.js" node --test tests/review-sections.test.cjs > qa-artifacts/red-baseline.tap 2>&1; then
            echo 'Expected original missing review index to fail'
            exit 1
          fi
          grep -q 'selectReviewSections is not a function' qa-artifacts/red-baseline.tap
      - name: Inspect published baseline
        if: github.ref != 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          REVIEW_URL: https://richardhan.github.io/ai-agent-use-cases/
          REVIEW_OBSERVE: '1'
        run: node tests/review-sections-browser.cjs
      - name: Verify updated journeys and existing contextual reader
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          REVIEW_URL: http://127.0.0.1:8100/ai-agent-use-cases/
          READER_SEARCH_URL: http://127.0.0.1:8100/ai-agent-use-cases/
          READER_SEARCH_ENGINES: all
        run: |
          python3 -m http.server 8100 --directory "$RUNNER_TEMP/preview" > /tmp/review-preview.log 2>&1 &
          node tests/review-sections-browser.cjs
          node tests/reader-search-browser.cjs
      - name: Verify actual Pages assets and published journeys
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          REVIEW_URL: https://richardhan.github.io/ai-agent-use-cases/
          REVIEW_OUTPUT: qa-artifacts/published
          READER_SEARCH_URL: https://richardhan.github.io/ai-agent-use-cases/
          READER_SEARCH_OUTPUT: qa-artifacts/published-context
          READER_SEARCH_ENGINES: all
        run: |
          python3 - <<'PYTHON'
          import pathlib, time, urllib.request
          files=('assets/app.js','assets/reader.js','assets/reader.css','index.html')
          for attempt in range(60):
              try:
                  matches=[]
                  for name in files:
                      with urllib.request.urlopen('https://richardhan.github.io/ai-agent-use-cases/'+name+'?review-qa='+str(time.time()), timeout=30) as response:
                          matches.append(response.read()==pathlib.Path(name).read_bytes())
                  if all(matches):
                      print('PUBLISHED_ASSETS_MATCH')
                      break
              except Exception as error:
                  print(type(error).__name__)
              time.sleep(5)
          else:
              raise SystemExit('Pages assets did not match')
          PYTHON
          node tests/review-sections-browser.cjs
          node tests/reader-search-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidence-round
          path: qa-artifacts/
          retention-days: 30
