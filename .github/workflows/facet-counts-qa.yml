name: Facet counts QA
on:
  push:
    branches: [improve/visitor-round-20261024-b, main]
    paths: ['assets/**', 'index.html', 'catalog.json', 'corpus.json', 'cases/**', 'evidence/**', 'sources/pending.md', 'scripts/**', 'tests/facet-*', 'tests/filter-controls.cjs', 'tests/source-route.cjs', 'tests/reliability-observe.cjs', 'tests/page-context-browser.cjs', 'tests/source-guide*', '.github/workflows/facet-counts-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts qa-artifacts
          for weight in Regular Bold; do curl -fL --retry 2 --max-time 90 "https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-$weight.otf" -o "/usr/local/share/fonts/NotoSansCJKtc-$weight.otf"; done
          fc-cache -f
          chown -R pwuser:pwuser qa-artifacts
      - name: Baseline tests and syntax
        run: |
          node --test tests/*.test.cjs > qa-artifacts/unit.tap 2>&1
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
      - name: Actual Pages build
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify actual Pages corpus and preview compatibility
        run: |
          python3 scripts/check_corpus_bundle.py _site
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          python3 scripts/check_corpus_bundle.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          mkdir -p "$RUNNER_TEMP/served/ai-agent-use-cases"
          cp -R _site/. "$RUNNER_TEMP/served/ai-agent-use-cases/"
      - name: Prove original hidden-filter AX failure on the same corpus
        if: github.ref == 'refs/heads/improve/visitor-round-20261024-b'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          GUIDE_URL: http://127.0.0.1:8096/ai-agent-use-cases/
          GUIDE_OUTPUT: qa-artifacts/source-guide-before
        run: |
          python3 -m http.server 8096 --directory "$RUNNER_TEMP/served" > /tmp/facet-before.log 2>&1 &
          git show c989742:tests/source-guide-browser.cjs > tests/source-guide-before.cjs
          if runuser -u pwuser -- node tests/source-guide-before.cjs > qa-artifacts/source-guide-red.log 2>&1; then
            echo 'Expected original hidden-filter assertion to fail'
            exit 1
          fi
          grep -q 'closed guidance still describes the source filter' qa-artifacts/source-guide-red.log
          kill $!
      - name: Verify counts, empty recovery, source descriptions and reading journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          GUIDE_URL: http://127.0.0.1:8096/ai-agent-use-cases/
          SITE_URL: http://127.0.0.1:8096/ai-agent-use-cases/
        run: |
          python3 -m http.server 8096 --directory "$RUNNER_TEMP/served" > /tmp/facet.log 2>&1 &
          runuser -u pwuser -- node tests/facet-counts-browser.cjs
          QA_OUT=qa-artifacts/preview-walk runuser -u pwuser -- node tests/reliability-observe.cjs
          runuser -u pwuser -- node tests/source-guide-browser.cjs
          QA_OUT=qa-artifacts/journeys runuser -u pwuser -- node tests/page-context-browser.cjs
      - name: Verify the published site
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          FACET_URL: https://richardhan.github.io/ai-agent-use-cases/
          GUIDE_URL: https://richardhan.github.io/ai-agent-use-cases/
          GUIDE_OUTPUT: qa-artifacts/published-source-guide
          GUIDE_PUBLISHED: '1'
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const base=process.env.FACET_URL;
            const files=['index.html','assets/app.js','assets/style.css','assets/reader.js','assets/reader.css','catalog.json','corpus.json'];
            for(let attempt=0;attempt<60;attempt++){
              const matches=await Promise.all(files.map(async file=>{
                const response=await fetch(base+(file==='index.html'?'':file)+'?facet-release='+process.env.GITHUB_SHA,{cache:'no-store'});
                return response.ok&&await response.text()===fs.readFileSync('_site/'+file,'utf8');
              }));
              if(matches.every(Boolean)){console.log('PUBLISHED_ASSETS_MATCH '+process.env.GITHUB_SHA);return;}
              await new Promise(resolve=>setTimeout(resolve,3000));
            }
            throw Error('Published assets or corpus do not match this Pages build');
          })().catch(error=>{console.error(error);process.exitCode=1});
          NODE
          mkdir -p qa-artifacts/preview
          mv qa-artifacts/after-* qa-artifacts/empty-* qa-artifacts/verification.json qa-artifacts/preview/
          runuser -u pwuser -- node tests/facet-counts-browser.cjs
          runuser -u pwuser -- node tests/source-guide-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facets-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
