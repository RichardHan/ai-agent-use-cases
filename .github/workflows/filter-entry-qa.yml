name: Filter entry QA
on:
  push:
    branches: ['improve/filter-summary-20261020']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/filter-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/filter-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Browse current published site
        env:
          NODE_PATH: ${{ runner.temp }}/filter-tools/node_modules
          SUBMIT_OBSERVE: '1'
          SUBMIT_OUTPUT: qa-artifacts/baseline
        run: node tests/search-submit-browser.cjs
      - name: Inspect filter state
        env:
          NODE_PATH: ${{ runner.temp }}/filter-tools/node_modules
        run: node tests/filter-entry-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filter-entry-${{ github.run_id }}
          path: qa-artifacts/
