name: Filter reading QA
on:
  push:
    branches: [improve/reader-round-20261024-next]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts qa-artifacts
          curl -fL --max-time 90 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          chown -R pwuser:pwuser qa-artifacts
      - name: Observe published baseline
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          QA_OUT: qa-artifacts/before-journeys
        run: |
          runuser -u pwuser -- node tests/filter-reading-observe.cjs
          runuser -u pwuser -- node tests/round23-observe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filter-reading-qa
          path: qa-artifacts/
