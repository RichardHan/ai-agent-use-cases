name: Filter reading QA
on:
  push:
    branches: [improve/reader-round-20261024-next, verify/filter-reading-20261024]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts qa-artifacts
          curl -fL --max-time 90 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          chown -R pwuser:pwuser qa-artifacts
      - name: Observe published baseline
        if: github.ref_name != 'verify/filter-reading-20261024'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          QA_OUT: qa-artifacts/before-journeys
        run: |
          runuser -u pwuser -- node tests/filter-reading-observe.cjs
          runuser -u pwuser -- node tests/round23-observe.cjs
      - name: Reproduce readability regression on the original preview
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p "$RUNNER_TEMP/before"
          git archive 5876d13 | tar -x -C "$RUNNER_TEMP/before"
          python3 "$RUNNER_TEMP/before/scripts/preview.py" "$RUNNER_TEMP/before-preview/ai-agent-use-cases"
          python3 -m http.server 8186 --directory "$RUNNER_TEMP/before-preview" > /tmp/filter-before.log 2>&1 &
          if SITE_URL=http://127.0.0.1:8186/ai-agent-use-cases/ QA_OUT=qa-artifacts/red runuser -u pwuser -- node tests/filter-reading-browser.cjs > qa-artifacts/red.log 2>&1; then
            echo 'Expected old layout to fail'; exit 1
          fi
          node -e "require('node:assert/strict').match(require('node:fs').readFileSync('qa-artifacts/red.log','utf8'),/labels and reset must remain legible/)"
      - name: Verify new layout and complete visitor journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          node --test --test-reporter=tap tests/*.test.cjs > qa-artifacts/unit.tap 2>&1
          for f in assets/*.js tests/filter-reading*.cjs; do node --check "$f"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          python3 -m http.server 8187 --directory "$RUNNER_TEMP/preview" > /tmp/filter-after.log 2>&1 &
          export SITE_URL=http://127.0.0.1:8187/ai-agent-use-cases/
          if [ "$GITHUB_REF_NAME" = verify/filter-reading-20261024 ]; then
            export SITE_URL=https://richardhan.github.io/ai-agent-use-cases/
            export QA_PUBLIC=1 QA_OBSERVE=1
            node - <<'JS'
          const fs=require('node:fs');
          (async()=>{const files=['index.html','assets/app.js','assets/style.css','assets/reader.js','assets/reader.css'];for(let i=0;i<90;i++){const matches=await Promise.all(files.map(async file=>{const r=await fetch(process.env.SITE_URL+file+'?filter='+process.env.GITHUB_SHA,{cache:'no-store'});return r.ok&&await r.text()===fs.readFileSync(file,'utf8');}));if(matches.every(Boolean)){console.log('PUBLIC_ASSETS_MATCH '+process.env.GITHUB_SHA);return;}await new Promise(r=>setTimeout(r,2000));}throw Error('Published assets mismatch');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          fi
          runuser -u pwuser -- node tests/filter-reading-browser.cjs
          QA_OUT=qa-artifacts/regression runuser -u pwuser -- node tests/page-context-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: filter-reading-qa
          path: qa-artifacts/
