name: Home search entry QA
on:
  push:
    branches: [main]
    paths: ['assets/**', 'index.html', 'tests/home-search-entry-browser.cjs', 'tests/home-task-entry.test.cjs', 'tests/hero-value*', '.github/workflows/home-search-entry-qa.yml']
  pull_request:
    paths: ['assets/**', 'index.html', 'tests/home-search-entry-browser.cjs', 'tests/home-task-entry.test.cjs', 'tests/hero-value*', '.github/workflows/home-search-entry-qa.yml']
permissions:
  contents: read
jobs:
  entry:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/entry-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/entry-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Capture and measure the unchanged baseline
        env:
          NODE_PATH: ${{ runner.temp }}/entry-tools/node_modules
          SEARCH_ENTRY_URL: http://127.0.0.1:8088/ai-agent-use-cases/
          SEARCH_ENTRY_OBSERVE: '1'
        run: |
          git worktree add --detach "$RUNNER_TEMP/entry-before" 680131845b394598696479682e9907e6b62951ad
          python3 "$RUNNER_TEMP/entry-before/scripts/preview.py" "$RUNNER_TEMP/entry-before-preview/ai-agent-use-cases"
          python3 -m http.server 8088 --directory "$RUNNER_TEMP/entry-before-preview" > /tmp/entry-before.log 2>&1 &
          node tests/home-search-entry-browser.cjs
      - name: Unit tests, syntax and static preview
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/entry-preview/ai-agent-use-cases"
      - name: Verify homepage to search journeys
        env:
          NODE_PATH: ${{ runner.temp }}/entry-tools/node_modules
        run: |
          python3 -m http.server 8087 --directory "$RUNNER_TEMP/entry-preview" > /tmp/entry-preview.log 2>&1 &
          node tests/home-search-entry-browser.cjs
          HERO_VALUE_URL=http://127.0.0.1:8087/ai-agent-use-cases/ node tests/hero-value-browser.cjs
      - name: Wait for and verify published Pages assets
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          NODE_PATH: ${{ runner.temp }}/entry-tools/node_modules
          SEARCH_ENTRY_URL: https://richardhan.github.io/ai-agent-use-cases/
        run: |
          node <<'NODE'
          const {waitForPublishedAssets}=require('./scripts/published-assets.cjs');
          (async()=>{
            const sha=process.env.GITHUB_SHA,files=['index.html','assets/app.js','assets/style.css'];
            const result=await waitForPublishedAssets({base:process.env.SEARCH_ENTRY_URL,sha,files});
            console.log(result==='matched'?'PUBLISHED_ASSETS_MATCH '+sha:'SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+sha);
          })().catch(error=>{console.error(error);process.exitCode=1;});
          NODE
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/home-search-entry-browser.cjs
          HERO_VALUE_URL=https://richardhan.github.io/ai-agent-use-cases/ node tests/hero-value-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: home-search-entry-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
