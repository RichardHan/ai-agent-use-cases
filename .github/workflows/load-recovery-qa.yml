name: Partial Load QA
on:
  workflow_dispatch:
  push:
    branches: ['closed-historical']
    paths: ['assets/**', 'index.html', 'cases/**', 'evidence/**', 'sources/pending.md', 'tests/load-recovery*', 'tests/visitor-experience-and-ci.test.cjs', 'tests/published-assets.test.cjs', 'tests/published-check.test.cjs', 'scripts/published-assets.cjs', 'scripts/published-check.cjs', '.github/workflows/load-recovery-qa.yml']
  pull_request:
    paths: ['assets/**', 'index.html', 'cases/**', 'evidence/**', 'sources/pending.md', 'tests/load-recovery*', 'tests/visitor-experience-and-ci.test.cjs', 'tests/published-assets.test.cjs', 'tests/published-check.test.cjs', 'scripts/published-assets.cjs', 'scripts/published-check.cjs', '.github/workflows/load-recovery-qa.yml']
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and preview build
        run: |
          node --test tests/*.test.cjs
          node --check assets/app.js
          node --check assets/reader.js
          python3 scripts/preview.py "$RUNNER_TEMP/load-preview/ai-agent-use-cases"
      - name: Install existing cloud QA tools
        run: |
          npm install --prefix "$RUNNER_TEMP/load-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/load-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify partial loading and recovery
        env:
          NODE_PATH: ${{ runner.temp }}/load-tools/node_modules
          LOAD_ENGINES: all
          PREVIEW_ROOT: ${{ runner.temp }}/load-preview
        run: |
          python3 -m http.server 8086 --directory "$PREVIEW_ROOT" > /tmp/load-preview.log 2>&1 &
          node tests/load-recovery-browser.cjs
      # A pull request does not control the published site, so this walk used to
      # fail on someone else's deploy. Keep it for manual runs instead.
      - name: Walk the current published website
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          NODE_PATH: ${{ runner.temp }}/load-tools/node_modules
          LOAD_DEPLOYED: ${{ github.event_name == 'push' && '1' || '0' }}
        run: node tests/load-recovery-live.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: load-recovery-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
