name: Method shortcut QA
on:
  push:
    branches: [feat/reader-method-shortcut, main]
    paths: ['assets/**', 'tests/method-shortcut*', '.github/workflows/method-shortcut-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  journey:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline unit tests, syntax and static build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/method-preview/ai-agent-use-cases"
          node -e "const c=require(process.env.RUNNER_TEMP+'/method-preview/ai-agent-use-cases/catalog.json'); if(c.sourceRevision!==process.env.GITHUB_SHA) throw Error('Preview source revision does not match checked-out commit')"
      - name: Cloud browser tools
        run: npm install --prefix "$RUNNER_TEMP/method-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
      - name: Observe published baseline
        if: ${{ github.ref != 'refs/heads/main' }}
        env:
          NODE_PATH: ${{ runner.temp }}/method-tools/node_modules
          METHOD_URL: https://richardhan.github.io/ai-agent-use-cases/
          OBSERVE: '1'
        run: node tests/method-shortcut-browser.cjs
      - name: Verify preview when implemented
        if: ${{ hashFiles('tests/method-shortcut.test.cjs') != '' }}
        env:
          NODE_PATH: ${{ runner.temp }}/method-tools/node_modules
          READING_URL: http://127.0.0.1:8095/ai-agent-use-cases/
          READER_URL: http://127.0.0.1:8095/ai-agent-use-cases/
        run: |
          python3 -m http.server 8095 --directory "$RUNNER_TEMP/method-preview" > /tmp/method-preview.log 2>&1 &
          node tests/method-shortcut-browser.cjs
          node tests/reading-flow-browser.cjs
          node tests/reader-browser.cjs
      - name: Verify published assets and journey
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          NODE_PATH: ${{ runner.temp }}/method-tools/node_modules
          METHOD_URL: https://richardhan.github.io/ai-agent-use-cases/
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const {isCurrentMainCommit}=require('./scripts/published-check.cjs');
          (async()=>{
          if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
            for(let i=0;i<501;i++){
              if(i>0&&i%15===0&&!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
              const files=['assets/reader.js','assets/reader.css'];
              const matches=await Promise.all(files.map(async file=>{
                const r=await fetch(process.env.METHOD_URL+file+'?method='+process.env.GITHUB_SHA,{cache:'no-store'});
                return r.ok&&await r.text()===fs.readFileSync(file,'utf8');
              }));
              if(matches.every(Boolean)){console.log('PUBLISHED_ASSETS_MATCH '+process.env.GITHUB_SHA);return;}
              await new Promise(r=>setTimeout(r,3000));
            }
            if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
            throw Error('Published reader assets mismatch after 501 attempts at three-second intervals');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/method-shortcut-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: method-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
