name: Reading flow round QA
on:
  push:
    branches: [improve/reader-outline-20261021]
    paths: ['tests/outline*', '.github/workflows/outline-qa.yml', 'assets/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Observe published journey
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node tests/outline-observe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-round-${{ github.run_id }}
          path: qa-artifacts/
