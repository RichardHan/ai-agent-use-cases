name: Reading flow round QA
on:
  push:
    branches: [improve/reader-outline-20261021, verify/prompt-copy-published-20261021]
  workflow_dispatch:
    inputs:
      target:
        type: choice
        description: Browser target
        options: [preview, published]
        default: preview
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit and build
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for f in assets/*.js tests/outline*.cjs; do node --check "$f"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Reproduce missing copy and compare baseline
        if: inputs.target != 'published' && github.ref != 'refs/heads/verify/prompt-copy-published-20261021'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          COPY_URL: http://127.0.0.1:8181/ai-agent-use-cases/
          COPY_OUTPUT: qa-artifacts/before
          COPY_OBSERVE: '1'
        run: |
          cp -R "$RUNNER_TEMP/preview" "$RUNNER_TEMP/before"
          git show ce58a09:assets/reader.js > "$RUNNER_TEMP/before/ai-agent-use-cases/assets/reader.js"
          git show ce58a09:assets/reader.css > "$RUNNER_TEMP/before/ai-agent-use-cases/assets/reader.css"
          python3 -m http.server 8181 --directory "$RUNNER_TEMP/before" > /tmp/copy-before.log 2>&1 &
          node tests/outline-copy-browser.cjs
          git show ce58a09:assets/reader.js > "$RUNNER_TEMP/reader-before.js"
          sed "s|require('../assets/reader.js')|require('$RUNNER_TEMP/reader-before.js')|" tests/prompt-copy.test.cjs > "$RUNNER_TEMP/prompt-copy-red.cjs"
          if node --test "$RUNNER_TEMP/prompt-copy-red.cjs" > qa-artifacts/red.tap 2>&1; then exit 1; fi
          grep -q 'selectCopySections is not a function' qa-artifacts/red.tap
      - name: Verify copy flows and existing reading
        if: inputs.target != 'published' && github.ref != 'refs/heads/verify/prompt-copy-published-20261021'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_URL: http://127.0.0.1:8180/ai-agent-use-cases/
        run: |
          python3 -m http.server 8180 --directory "$RUNNER_TEMP/preview" > /tmp/copy-after.log 2>&1 &
          node tests/outline-copy-browser.cjs
          node tests/reader-browser.cjs > qa-artifacts/reader.log 2>&1
      - name: Verify published copy flows
        if: inputs.target == 'published' || github.ref == 'refs/heads/verify/prompt-copy-published-20261021'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          COPY_URL: https://richardhan.github.io/ai-agent-use-cases/
          COPY_OUTPUT: qa-artifacts/published
          COPY_LIVE: '1'
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          (async()=>{for(const file of ['assets/reader.js','assets/reader.css']){
            const r=await fetch(process.env.COPY_URL+file+'?copy='+process.env.GITHUB_SHA);
            if(!r.ok||await r.text()!==fs.readFileSync(file,'utf8'))throw Error('Published mismatch '+file);
          }fs.writeFileSync('qa-artifacts/published-assets.json',JSON.stringify({sha:process.env.GITHUB_SHA,matched:true}));})().catch(e=>{console.error(e);process.exitCode=1});
          JS
          node tests/outline-copy-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-round-${{ github.run_id }}
          path: qa-artifacts/
