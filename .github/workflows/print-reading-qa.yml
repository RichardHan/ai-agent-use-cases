name: Print reading QA
on:
  push:
    branches: [improve/reader-print-20261021-v2, fix/print-mobile-reading-density, main]
    paths: ['assets/app.js', 'assets/reader.js', 'assets/reader.css', 'assets/style.css', 'index.html', 'tests/print*', '.github/workflows/print-reading-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and static build
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/print-preview/ai-agent-use-cases"
      - name: Cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/print-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/print-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Reproduce original missing print lifecycle
        run: |
          mkdir -p qa-artifacts "$RUNNER_TEMP/print-red/assets" "$RUNNER_TEMP/print-red/tests"
          git show 9f22923:assets/reader.js > "$RUNNER_TEMP/print-red/assets/reader.js"
          cp tests/print.test.cjs "$RUNNER_TEMP/print-red/tests/"
          if node --test "$RUNNER_TEMP/print-red/tests/print.test.cjs" > qa-artifacts/red.tap 2>&1; then exit 1; fi
          grep -q 'createPrintSession is not a function' qa-artifacts/red.tap
      - name: Observe published site
        if: github.ref != 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/print-tools/node_modules
          PRINT_URL: https://richardhan.github.io/ai-agent-use-cases/
          OBSERVE: '1'
        run: node tests/print-browser.cjs
      - name: Verify preview
        env:
          NODE_PATH: ${{ runner.temp }}/print-tools/node_modules
        run: |
          python3 -m http.server 8108 --directory "$RUNNER_TEMP/print-preview" > /tmp/print-preview.log 2>&1 &
          node tests/print-browser.cjs
      - name: Preserve long-title purpose and method shortcut
        env:
          NODE_PATH: ${{ runner.temp }}/print-tools/node_modules
          ROUND_URL: http://127.0.0.1:8108/ai-agent-use-cases/
          METHOD_URL: http://127.0.0.1:8108/ai-agent-use-cases/
          SHARE_URL: http://127.0.0.1:8108/ai-agent-use-cases/
          SHARE_OUTPUT: qa-artifacts/compact-sharing
        run: |
          node tests/round-browser.cjs
          node tests/method-shortcut-browser.cjs
          node tests/case-share-browser.cjs
      - name: Verify published print flow
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/print-tools/node_modules
          PRINT_URL: https://richardhan.github.io/ai-agent-use-cases/
          VERIFY_ASSETS: '1'
          LABEL: published
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          const {isCurrentMainCommit}=require('./scripts/published-check.cjs');
          (async()=>{
          if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
            const paths=['assets/app.js','assets/reader.js','assets/reader.css'];
            for(let i=0;i<301;i++){
              if(i>0&&i%15===0&&!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
              const states=await Promise.all(paths.map(async path=>{
                const r=await fetch(process.env.PRINT_URL+path+'?print='+process.env.GITHUB_SHA,{cache:'no-store'});
                return r.ok&&await r.text()===fs.readFileSync(path,'utf8');
              }));
              if(states.every(Boolean))return;
              await new Promise(resolve=>setTimeout(resolve,3000));
            }
            if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}
            throw Error('Published print assets do not match after 301 attempts at three-second intervals');
          })().catch(e=>{console.error(e);process.exitCode=1});
          NODE
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/print-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-reading-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
