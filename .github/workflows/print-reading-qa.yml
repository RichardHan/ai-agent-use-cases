name: Print reading QA
on:
  push:
    branches: [improve/reader-print-20261021-v2, main]
    paths: ['assets/reader.js', 'assets/reader.css', 'tests/print*', '.github/workflows/print-reading-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and static build
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/print-preview/ai-agent-use-cases"
      - name: Cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/print-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/print-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk poppler-utils
      - name: Reproduce original missing print lifecycle
        run: |
          mkdir -p qa-artifacts "$RUNNER_TEMP/print-red/assets" "$RUNNER_TEMP/print-red/tests"
          git show 9f22923:assets/reader.js > "$RUNNER_TEMP/print-red/assets/reader.js"
          cp tests/print.test.cjs "$RUNNER_TEMP/print-red/tests/"
          if node --test "$RUNNER_TEMP/print-red/tests/print.test.cjs" > qa-artifacts/red.tap 2>&1; then exit 1; fi
          grep -q 'createPrintSession is not a function' qa-artifacts/red.tap
      - name: Observe published site
        env:
          NODE_PATH: ${{ runner.temp }}/print-tools/node_modules
          PRINT_URL: https://richardhan.github.io/ai-agent-use-cases/
          OBSERVE: '1'
        run: node tests/print-browser.cjs
      - name: Verify preview
        env:
          NODE_PATH: ${{ runner.temp }}/print-tools/node_modules
        run: |
          python3 -m http.server 8108 --directory "$RUNNER_TEMP/print-preview" > /tmp/print-preview.log 2>&1 &
          node tests/print-browser.cjs
      - name: Verify published print flow
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/print-tools/node_modules
          PRINT_URL: https://richardhan.github.io/ai-agent-use-cases/
          VERIFY_ASSETS: '1'
          LABEL: published
        run: |
          node <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const paths=['assets/app.js','assets/reader.js','assets/reader.css'];
            for(let i=0;i<60;i++){
              const states=await Promise.all(paths.map(async path=>{
                const r=await fetch(process.env.PRINT_URL+path+'?print='+process.env.GITHUB_SHA,{cache:'no-store'});
                return r.ok&&await r.text()===fs.readFileSync(path,'utf8');
              }));
              if(states.every(Boolean))return;
              await new Promise(resolve=>setTimeout(resolve,3000));
            }
            throw Error('Published print assets do not match');
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
          node tests/print-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: print-reading-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
