name: Published related verification
on:
  push:
    branches: [verify/shared-reading-published-related]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/related-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/related-tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Recheck the unchanged published related-reading journey
        env:
          NODE_PATH: ${{ runner.temp }}/related-tools/node_modules
          RELATED_URL: https://richardhan.github.io/ai-agent-use-cases/
          RELATED_LIVE: '1'
        run: node tests/related-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: published-related-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
