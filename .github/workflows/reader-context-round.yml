name: Reader context round
on:
  workflow_dispatch:
  push:
    branches: [improve/reader-context-search]
    paths: ['.github/workflows/reader-context-round.yml', 'tests/reader-context-round.cjs']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and preview build
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/baseline.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Install browsers in authorized cloud
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Walk current published desktop and mobile site
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          CORPUS_LABEL: round-baseline
        run: |
          node tests/corpus-browser.cjs
          CONTEXT_OBSERVE=1 node tests/reader-context-round.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-context-round
          path: qa-artifacts/
          retention-days: 30
