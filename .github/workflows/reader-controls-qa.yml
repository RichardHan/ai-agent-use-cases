name: Reader controls QA
on:
  push:
    branches: [improve/reader-position]
permissions:
  contents: read
jobs:
  controls:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Baseline and preview
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          node --test tests/*.test.cjs > /tmp/unit.tap
          tail -8 /tmp/unit.tap
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          python3 -m http.server 8100 --directory "$RUNNER_TEMP/preview" > /tmp/preview.log 2>&1 &
          LABEL=before OBSERVE=1 CONTROLS_URL=https://richardhan.github.io/ai-agent-use-cases/ node tests/reader-controls-browser.cjs
          if [ -f tests/reader-controls.test.cjs ]; then LABEL=after node tests/reader-controls-browser.cjs; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-controls
          path: qa-artifacts/
