name: Reader search QA
on:
  pull_request:
    paths: ['assets/**', 'tests/reader-search*', '.github/workflows/reader-search-qa.yml']
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Optional published URL; blank uses static preview'
        required: false
        default: ''
permissions:
  contents: read
jobs:
  reader-search:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Regression tests, syntax and static preview
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/reader-search-preview/ai-agent-use-cases"
      - name: Install browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/reader-search-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/reader-search-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify desktop, mobile, keyboard, sources and accessibility
        env:
          NODE_PATH: ${{ runner.temp }}/reader-search-tools/node_modules
          READER_SEARCH_ENGINES: all
          TARGET_URL: ${{ inputs.target_url }}
        run: |
          python3 -m http.server 8098 --directory "$RUNNER_TEMP/reader-search-preview" > /tmp/reader-search-preview.log 2>&1 &
          export READER_SEARCH_URL="${TARGET_URL:-http://127.0.0.1:8098/ai-agent-use-cases/}"
          if [ -n "$TARGET_URL" ]; then
            python3 - <<'PY'
          import os, pathlib, urllib.request
          import subprocess
          result=subprocess.run(['node','-e',"const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"],check=False)
          if result.returncode == 42:
              print('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+__import__('os').environ.get('GITHUB_SHA',''))
              raise SystemExit(0)
          for name in ('assets/app.js','assets/reader.js','assets/reader.css'):
              with urllib.request.urlopen(os.environ['TARGET_URL'].rstrip('/')+'/'+name, timeout=45) as r:
                  assert r.read() == pathlib.Path(name).read_bytes(), name+' differs from checked-out publication'
          print('PUBLISHED_ASSETS_MATCH')
          PY
          fi
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/reader-search-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-search-${{ github.run_id }}
          path: qa-artifacts/reader-search/
          retention-days: 30
