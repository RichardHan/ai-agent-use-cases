name: Reading anchor QA
on:
  push:
    branches: [improve/reader-findability-20261020, main]
    paths: ['assets/**', 'tests/reading-anchor*', '.github/workflows/reading-anchor-qa.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and preview
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Reading anchor acceptance and existing journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          ROUND_ENGINES: all
          SUBMIT_URL: http://127.0.0.1:8100/ai-agent-use-cases/
          SUBMIT_OUTPUT: qa-artifacts/search
          READER_URL: http://127.0.0.1:8100/ai-agent-use-cases/
        run: |
          python3 -m http.server 8100 --directory "$RUNNER_TEMP/preview" > /tmp/anchor-preview.log 2>&1 &
          node tests/reading-anchor-browser.cjs
          node tests/round-browser.cjs
          node tests/search-submit-browser.cjs > qa-artifacts/search.log 2>&1
          node tests/reader-browser.cjs > qa-artifacts/reader.log 2>&1
      - name: Published reading acceptance
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          ANCHOR_URL: https://richardhan.github.io/ai-agent-use-cases/
          ANCHOR_OUTPUT: qa-artifacts/published
        run: |
          node <<'NODE'
          const {waitForPublishedAssets}=require('./scripts/published-assets.cjs');
          waitForPublishedAssets({base:process.env.ANCHOR_URL,sha:process.env.GITHUB_SHA,files:['assets/app.js']})
            .then(result=>console.log(result==='matched'?'PUBLISHED_ASSETS_MATCH '+process.env.GITHUB_SHA:'SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA))
            .catch(e=>{console.error(e);process.exitCode=1});
          NODE
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/reading-anchor-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-anchor-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
