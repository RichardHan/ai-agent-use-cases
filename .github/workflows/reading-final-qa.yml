name: Reading final QA
on:
  push:
    branches: [improve/reading-round-20261024-final, verify/reading-final-20261024]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts qa-artifacts
          curl -fL --max-time 90 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          chown -R pwuser:pwuser qa-artifacts
      - name: Tests and original reading regression
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --test --test-reporter=tap tests/*.test.cjs > qa-artifacts/unit.tap 2>&1
          for f in assets/*.js tests/reading-history*.cjs; do node --check "$f"; done
          mkdir -p "$RUNNER_TEMP/before"
          git archive 151a432 | tar -x -C "$RUNNER_TEMP/before"
          python3 "$RUNNER_TEMP/before/scripts/preview.py" "$RUNNER_TEMP/before-preview/ai-agent-use-cases"
          python3 -m http.server 8189 --directory "$RUNNER_TEMP/before-preview" > /tmp/reading-before.log 2>&1 &
          SITE_URL=http://127.0.0.1:8189/ai-agent-use-cases/ QA_OUT=qa-artifacts/history-before QA_OBSERVE=1 runuser -u pwuser -- node tests/reading-history-browser.cjs
          if SITE_URL=http://127.0.0.1:8189/ai-agent-use-cases/ QA_OUT=qa-artifacts/red runuser -u pwuser -- node tests/reading-history-browser.cjs > qa-artifacts/red.log 2>&1; then
            echo 'Expected reading-position regression'; exit 1
          fi
          node -e "require('node:assert/strict').match(require('node:fs').readFileSync('qa-artifacts/red.log','utf8'),/History must restore expanded original research/)"
      - name: Reading history and complete visitor journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          python3 -m http.server 8190 --directory "$RUNNER_TEMP/preview" > /tmp/reading-after.log 2>&1 &
          export SITE_URL=http://127.0.0.1:8190/ai-agent-use-cases/
          if [ "$GITHUB_REF_NAME" = verify/reading-final-20261024 ]; then
            export SITE_URL=https://richardhan.github.io/ai-agent-use-cases/
            node - <<'JS'
          const fs=require('node:fs');
          const {isCurrentMainCommit}=require('./scripts/published-check.cjs');
          (async()=>{
          if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}for(const file of ['index.html','assets/app.js','assets/style.css','assets/reader.js','assets/reader.css']){const r=await fetch(process.env.SITE_URL+file+'?history='+process.env.GITHUB_SHA);if(!r.ok||await r.text()!==fs.readFileSync(file,'utf8'))throw Error('Published asset mismatch '+file);}console.log('PUBLIC_ASSETS_MATCH '+process.env.GITHUB_SHA);})().catch(e=>{console.error(e);process.exit(1)});
          JS
          fi
          QA_OUT=qa-artifacts/history-after runuser -u pwuser -- node tests/reading-history-browser.cjs
          QA_OUT=qa-artifacts/regression runuser -u pwuser -- node tests/page-context-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-final-qa
          path: qa-artifacts/
