name: Reading flow QA
on:
  pull_request:
    paths: ['assets/**', 'index.html', 'tests/reading-flow*', '.github/workflows/reading-flow-qa.yml']
  push:
    branches: [main]
    paths: ['assets/**', 'index.html', 'tests/reading-flow*', '.github/workflows/reading-flow-qa.yml']
permissions:
  contents: read
jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Baseline tests and static preview
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/reading-preview/ai-agent-use-cases"
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/reading-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/reading-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Observe current published reading flow
        env:
          NODE_PATH: ${{ runner.temp }}/reading-tools/node_modules
          READING_URL: https://richardhan.github.io/ai-agent-use-cases/
          READING_OBSERVE: '1'
        run: node tests/reading-flow-browser.cjs
      - name: Verify preview
        env:
          NODE_PATH: ${{ runner.temp }}/reading-tools/node_modules
        run: |
          python3 -m http.server 8086 --directory "$RUNNER_TEMP/reading-preview" > /tmp/reading-preview.log 2>&1 &
          READING_URL=http://127.0.0.1:8086/ai-agent-use-cases/ node tests/reading-flow-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-flow-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
