name: Reading round QA
on:
  push:
    branches: [improve/reading-round-20261022]
  workflow_dispatch:
    inputs:
      published:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit, syntax and static builds
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          git diff --check
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive 333833e | tar -x -C "$RUNNER_TEMP/baseline"
          python3 "$RUNNER_TEMP/baseline/scripts/preview.py" "$RUNNER_TEMP/before/ai-agent-use-cases"
      - name: Install browser drivers
        run: npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2 --fetch-timeout=30000 --fetch-retries=1
      - name: Install cloud browsers and Chinese fonts
        run: |
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Reproduce baseline and verify updated journeys
        if: inputs.published != true
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 -m http.server 8135 --directory "$RUNNER_TEMP/preview" > /tmp/reading-preview.log 2>&1 &
          python3 -m http.server 8136 --directory "$RUNNER_TEMP/before" > /tmp/reading-before.log 2>&1 &
          SITE_URL=http://127.0.0.1:8136/ai-agent-use-cases/ OBSERVE=1 QA_OUT=qa-artifacts/before node tests/reading-history-browser.cjs
          if SITE_URL=http://127.0.0.1:8136/ai-agent-use-cases/ RED=1 QA_OUT=qa-artifacts/red node tests/reading-history-browser.cjs > qa-artifacts/red.log 2>&1; then
            echo 'Expected original Back behavior to fail'; exit 1
          fi
          grep -q 'Back restores expanded original research' qa-artifacts/red.log
          node tests/reading-history-browser.cjs
      - name: Existing reader and search submission regression
        if: inputs.published != true
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_URL: http://127.0.0.1:8135/ai-agent-use-cases/
          SUBMIT_URL: http://127.0.0.1:8135/ai-agent-use-cases/
        run: |
          node tests/reader-browser.cjs > qa-artifacts/reader.log
          node tests/search-submit-browser.cjs > qa-artifacts/search-submit.log
      - name: Published asset equality and journeys
        if: inputs.published == true
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SITE_URL: https://richardhan.github.io/ai-agent-use-cases/
          QA_OUT: qa-artifacts/published
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          (async()=>{for(let i=0;i<60;i++){
            const matches=await Promise.all(['assets/app.js','assets/reader.js'].map(async file=>{try{const r=await fetch(process.env.SITE_URL+file+'?reading='+process.env.GITHUB_SHA,{signal:AbortSignal.timeout(15000)});return r.ok&&await r.text()===fs.readFileSync(file,'utf8');}catch{return false;}}));
            if(matches.every(Boolean)){fs.writeFileSync('qa-artifacts/published-assets.json',JSON.stringify({sha:process.env.GITHUB_SHA,matched:true,at:new Date().toISOString()}));return;}
            await new Promise(r=>setTimeout(r,10000));
          }throw Error('Published reading assets do not match checkout');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node tests/reading-history-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reading-round-qa
          path: qa-artifacts/
