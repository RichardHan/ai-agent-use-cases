name: Recent review discovery QA
on:
  push:
    branches: [improve/search-catalog-loading-20261020]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/recent-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/recent-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Observe published baseline
        env:
          NODE_PATH: ${{ runner.temp }}/recent-tools/node_modules
        run: node tests/recency-observe.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recent-discovery-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
