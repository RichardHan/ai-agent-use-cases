name: Recent review discovery QA
on:
  push:
    branches: [improve/search-catalog-loading-20261020, main]
    paths: ['assets/**', 'index.html', 'tests/recent-review*', '.github/workflows/recency-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/recent-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          if [ "$GITHUB_REF" = 'refs/heads/main' ]; then
            "$RUNNER_TEMP/recent-tools/node_modules/.bin/playwright" install --with-deps chromium
          else
            "$RUNNER_TEMP/recent-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          fi
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit tests, syntax and static preview
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js tests/recent-review*.cjs; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/recent-preview/ai-agent-use-cases"
      - name: Reproduce missing control against fixed baseline
        if: github.ref != 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/recent-tools/node_modules
          RECENT_URL: http://127.0.0.1:8130/ai-agent-use-cases/
          RECENT_BASELINE: '1'
          RECENT_OUTPUT: qa-artifacts/before
        run: |
          mkdir -p "$RUNNER_TEMP/recent-before" qa-artifacts
          git archive f03decb | tar -x -C "$RUNNER_TEMP/recent-before"
          python3 "$RUNNER_TEMP/recent-before/scripts/preview.py" "$RUNNER_TEMP/recent-before-preview/ai-agent-use-cases"
          python3 -m http.server 8130 --directory "$RUNNER_TEMP/recent-before-preview" > /tmp/recent-before.log 2>&1 &
          if node tests/recent-review-browser.cjs > qa-artifacts/red-browser.log 2>&1; then
            echo 'Expected the original site to fail the new feature check'; exit 1
          fi
          grep 'baseline reproduces missing recent-review control' qa-artifacts/red-browser.log
      - name: Verify complete journeys across browsers
        if: github.ref != 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/recent-tools/node_modules
          RECENT_URL: http://127.0.0.1:8131/ai-agent-use-cases/
          GUIDE_URL: http://127.0.0.1:8131/ai-agent-use-cases/
          READER_URL: http://127.0.0.1:8131/ai-agent-use-cases/
          BUDGET_URL: http://127.0.0.1:8131/ai-agent-use-cases/
          RELEVANCE_URL: http://127.0.0.1:8131/ai-agent-use-cases/
        run: |
          python3 -m http.server 8131 --directory "$RUNNER_TEMP/recent-preview" > /tmp/recent-preview.log 2>&1 &
          python3 -m http.server 8081 --directory "$RUNNER_TEMP/recent-preview" > /tmp/recent-discovery.log 2>&1 &
          for suite in recent-review-browser recent-review-recovery source-guide-mobile-regression loading-budget-browser relevance-browser; do
            if node "tests/$suite.cjs" > "qa-artifacts/$suite.log" 2>&1; then
              echo "PASS $suite"
            else
              tail -n 30 "qa-artifacts/$suite.log" | cut -c 1-500
              exit 1
            fi
          done
      - name: Verify published version before live journeys
        if: github.ref == 'refs/heads/main'
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const expected=['cases','evidence'].flatMap(dir=>fs.readdirSync(dir,{recursive:true}).filter(file=>file.endsWith('.md')).map(file=>dir+'/'+file)).concat('sources/pending.md').sort();
          const {waitForPublishedAssets}=require('./scripts/published-assets.cjs');
          waitForPublishedAssets({
            base:'https://richardhan.github.io/ai-agent-use-cases/',
            sha:process.env.GITHUB_SHA,
            files:['index.html','assets/app.js','assets/style.css'],
            verify:async({base,sha,attempt,signal,cache})=>{
              const response=await fetch(base+'catalog.json?publication='+encodeURIComponent(sha)+'-'+attempt,{signal,cache});
              if(!response.ok){await response.body?.cancel();return false;}
              const catalog=await response.json();
              return Array.isArray(catalog.files)&&JSON.stringify(catalog.files.slice().sort())===JSON.stringify(expected);
            }
          }).then(result=>console.log(result==='matched'?'Published HTML/JS/CSS and catalog match checkout':'SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA))
            .catch(e=>{console.error(e);process.exitCode=1});
          JS
      - name: Verify real HTTPS desktop and mobile journeys
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/recent-tools/node_modules
          RECENT_URL: https://richardhan.github.io/ai-agent-use-cases/
          RECENT_LIVE: '1'
          RECENT_OUTPUT: qa-artifacts/published
        run: |
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/recent-review-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recent-discovery-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
