name: Result batches QA
on:
  push:
    branches: ['improve/task-discovery-20261020']
    paths: ['tests/result-batches*', '.github/workflows/result-batches-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/batch-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/batch-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Inspect published site
        env:
          NODE_PATH: ${{ runner.temp }}/batch-tools/node_modules
        run: node tests/result-batches-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: result-batches-${{ github.sha }}
          path: qa-artifacts/
