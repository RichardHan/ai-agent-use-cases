name: Results return recovery QA
on:
  push:
    branches: ['fix/results-return-recovery']
    paths: ['assets/style.css', 'tests/results-return-recovery-browser.cjs', '.github/workflows/results-return-recovery-qa.yml']
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud browser
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify recovery focus and viewport bounds across motion preferences
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          RETURN_RECOVERY_ASSERT: '1'
        run: |
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          python3 -m http.server 8130 --directory "$RUNNER_TEMP/preview" > /tmp/return-recovery.log 2>&1 &
          node tests/results-return-recovery-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-recovery-${{ github.sha }}
          path: qa-artifacts/
