name: Compare return screenshot side effects
on:
  push:
    branches: [test/search-return-diagnostic]
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud WebKit
        run: |
          npm install --prefix "$RUNNER_TEMP/control-tools" playwright@1.64.1
          "$RUNNER_TEMP/control-tools/node_modules/.bin/playwright" install --with-deps webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Compare screenshot and no-screenshot published journeys
        env:
          NODE_PATH: ${{ runner.temp }}/control-tools/node_modules
          CONTROL_URL: https://richardhan.github.io/ai-agent-use-cases/
          CONTROL_NAME: live
        run: node tests/return-screenshot-control.cjs
      - name: Compare screenshot and no-screenshot preview journeys
        env:
          NODE_PATH: ${{ runner.temp }}/control-tools/node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/control-before"
          git archive 88c08fc1704a0b02408a4753062702759bccce2f | tar -x -C "$RUNNER_TEMP/control-before"
          python3 "$RUNNER_TEMP/control-before/scripts/preview.py" "$RUNNER_TEMP/control-before-preview/ai-agent-use-cases"
          python3 scripts/preview.py "$RUNNER_TEMP/control-after-preview/ai-agent-use-cases"
          python3 -m http.server 8093 --directory "$RUNNER_TEMP/control-before-preview" > /tmp/control-before.log 2>&1 &
          python3 -m http.server 8094 --directory "$RUNNER_TEMP/control-after-preview" > /tmp/control-after.log 2>&1 &
          CONTROL_URL=http://127.0.0.1:8093/ai-agent-use-cases/ CONTROL_NAME=baseline node tests/return-screenshot-control.cjs
          CONTROL_URL=http://127.0.0.1:8094/ai-agent-use-cases/ CONTROL_NAME=preview node tests/return-screenshot-control.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-control-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
