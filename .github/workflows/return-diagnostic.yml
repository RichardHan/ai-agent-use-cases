name: Observe native return
on:
  push:
    branches: [test/search-return-diagnostic]
permissions:
  contents: read
jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/trace-tools" playwright@1.64.1
          "$RUNNER_TEMP/trace-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Trace published native return
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/trace-tools/node_modules
          RETURN_URL: https://richardhan.github.io/ai-agent-use-cases/
          RETURN_NATIVE: '1'
        run: |
          node tests/return-diagnostic.cjs
      - name: Trace baseline and current previews
        env:
          NODE_PATH: ${{ runner.temp }}/trace-tools/node_modules
        run: |
          mkdir -p "$RUNNER_TEMP/trace-before"
          git archive 88c08fc1704a0b02408a4753062702759bccce2f | tar -x -C "$RUNNER_TEMP/trace-before"
          python3 "$RUNNER_TEMP/trace-before/scripts/preview.py" "$RUNNER_TEMP/trace-before-preview/ai-agent-use-cases"
          python3 scripts/preview.py "$RUNNER_TEMP/trace-after-preview/ai-agent-use-cases"
          python3 -m http.server 8093 --directory "$RUNNER_TEMP/trace-before-preview" > /tmp/trace-before.log 2>&1 &
          python3 -m http.server 8094 --directory "$RUNNER_TEMP/trace-after-preview" > /tmp/trace-after.log 2>&1 &
          RETURN_URL=http://127.0.0.1:8093/ai-agent-use-cases/ node tests/return-diagnostic.cjs
          mv qa-artifacts/return-after.json qa-artifacts/return-baseline.json
          RETURN_URL=http://127.0.0.1:8094/ai-agent-use-cases/ node tests/return-diagnostic.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-trace-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
