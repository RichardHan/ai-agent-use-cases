name: Exact native return control
on:
  push:
    branches: [test/search-return-diagnostic]
permissions:
  contents: read
jobs:
  exact:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud-only browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/exact-tools" playwright@1.64.1
          "$RUNNER_TEMP/exact-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: A - unchanged published test
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/exact-tools/node_modules
          RETURN_URL: https://richardhan.github.io/ai-agent-use-cases/
          RETURN_NATIVE: '1'
        run: |
          status=0
          node tests/return-visibility-browser.cjs || status=$?
          mv qa-artifacts/return-live.json qa-artifacts/exact-original.json
          exit "$status"
      - name: B - same published test with only the screenshot removed
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/exact-tools/node_modules
          RETURN_URL: https://richardhan.github.io/ai-agent-use-cases/
          RETURN_NATIVE: '1'
        run: |
          status=0
          node tests/return-no-shot.cjs || status=$?
          mv qa-artifacts/return-live.json qa-artifacts/exact-no-shot.json
          exit "$status"
      - name: C - same published test with only explicit context
        continue-on-error: true
        env:
          NODE_PATH: ${{ runner.temp }}/exact-tools/node_modules
          RETURN_URL: https://richardhan.github.io/ai-agent-use-cases/
          RETURN_NATIVE: '1'
        run: |
          status=0
          node tests/return-explicit.cjs || status=$?
          mv qa-artifacts/return-live.json qa-artifacts/exact-explicit.json
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact-native-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
