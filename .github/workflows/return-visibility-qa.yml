name: Return visibility QA
on:
  push:
    branches: [fix/reading-return-visibility, fix/late-native-return, main]
    paths: ['assets/app.js', 'tests/return-visibility*', '.github/workflows/return-visibility-qa.yml']
permissions:
  contents: read
jobs:
  return:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/return-tools" playwright@1.64.1
          "$RUNNER_TEMP/return-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Reproduce a return after the two-frame guard ends
        env:
          NODE_PATH: ${{ runner.temp }}/return-tools/node_modules
          RETURN_URL: http://127.0.0.1:8088/ai-agent-use-cases/
          RETURN_BEFORE: '1'
        run: |
          mkdir -p "$RUNNER_TEMP/return-before"
          git archive 7abbf02 | tar -x -C "$RUNNER_TEMP/return-before"
          python3 "$RUNNER_TEMP/return-before/scripts/preview.py" "$RUNNER_TEMP/return-before-preview/ai-agent-use-cases"
          python3 -m http.server 8088 --directory "$RUNNER_TEMP/return-before-preview" > /tmp/return-before.log 2>&1 &
          if node tests/return-visibility-browser.cjs; then
            echo 'Expected original return visibility failure was not reproduced'
            exit 1
          fi
          python3 - <<'PY'
          import json
          report = json.load(open('qa-artifacts/return-before.json'))[-1]
          assert report['rect']['bottom'] > report['height']
          PY
      - name: Verify updated return and preserve user focus
        env:
          NODE_PATH: ${{ runner.temp }}/return-tools/node_modules
        run: |
          node --test tests/*.test.cjs
          node --check assets/app.js
          python3 scripts/preview.py "$RUNNER_TEMP/return-preview/ai-agent-use-cases"
          python3 -m http.server 8087 --directory "$RUNNER_TEMP/return-preview" > /tmp/return-preview.log 2>&1 &
          node tests/return-visibility-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-visibility-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30

  published:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud native-path browsers
        run: |
          npm install --prefix "$RUNNER_TEMP/native-tools" playwright@1.64.1
          "$RUNNER_TEMP/native-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify the published unmodified Back path
        env:
          NODE_PATH: ${{ runner.temp }}/native-tools/node_modules
          RETURN_URL: https://richardhan.github.io/ai-agent-use-cases/
          RETURN_NATIVE: '1'
        run: node tests/return-visibility-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-native-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
