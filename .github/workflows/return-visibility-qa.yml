name: Return visibility QA
on:
  push:
    branches: [fix/reading-return-visibility, fix/late-native-return, test/ordered-late-return, fix/loading-acceptance-final, main]
    paths: ['assets/app.js', 'tests/return-visibility*', 'tests/late-return.test.cjs', '.github/workflows/return-visibility-qa.yml']
  pull_request:
    paths: ['assets/app.js', 'tests/return-visibility*', 'tests/late-return.test.cjs', '.github/workflows/return-visibility-qa.yml']
permissions:
  contents: read
jobs:
  return:
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm install --prefix "$RUNNER_TEMP/return-tools" playwright@1.64.1
      - name: Reproduce late-return failures with a deterministic clock
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          mkdir -p qa-artifacts
          git show 7abbf02:assets/app.js > "$RUNNER_TEMP/late-return-before.js"
          if RETURN_SOURCE_PATH="$RUNNER_TEMP/late-return-before.js" node --test --test-reporter=tap tests/late-return.test.cjs > qa-artifacts/late-return-red.tap 2>&1; then
            echo 'Expected old late-return tests to fail'
            exit 1
          fi
          python3 - <<'PYCODE'
          import re
          text = open('qa-artifacts/late-return-red.tap').read()
          for summary in ('# tests 13', '# pass 9', '# fail 4', '# cancelled 0', '# skipped 0'):
              assert summary in text
          for delay in (80, 180):
              block = re.search(r'^not ok \d+ - late return at '+str(delay)+r'ms .*?^  \.\.\.', text, re.M | re.S)
              assert block
              assert "code: 'ERR_ASSERTION'" in block[0]
              assert "error: 'late return remains visible'" in block[0]
          PYCODE
      - name: Verify updated return and preserve user focus
        env:
          NODE_PATH: ${{ runner.temp }}/return-tools/node_modules
        run: |
          node --test tests/*.test.cjs
          node --check assets/app.js
          python3 scripts/preview.py "$RUNNER_TEMP/return-preview/ai-agent-use-cases"
          python3 -m http.server 8087 --directory "$RUNNER_TEMP/return-preview" > /tmp/return-preview.log 2>&1 &
          node tests/return-visibility-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-visibility-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30

  published:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud native-path browsers
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm install --prefix "$RUNNER_TEMP/native-tools" playwright@1.64.1
      - name: Verify the published unmodified Back path
        env:
          NODE_PATH: ${{ runner.temp }}/native-tools/node_modules
          RETURN_URL: https://richardhan.github.io/ai-agent-use-cases/
          RETURN_NATIVE: '1'
        run: node tests/return-visibility-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-native-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
