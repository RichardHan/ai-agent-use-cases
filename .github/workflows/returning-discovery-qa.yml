name: Returning discovery QA
on:
  push:
    branches: [improve/returning-discovery-20261022, verify/returning-discovery-20261022]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit, syntax, static build and original regression
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          git diff --check
          git show 8e377db:assets/app.js > "$RUNNER_TEMP/original-app.js"
          if POSITION_SOURCE="$RUNNER_TEMP/original-app.js" node --test tests/reader-position.test.cjs > qa-artifacts/red.tap 2>&1; then
            echo 'Original must fail missing position assertions'; exit 1
          fi
          python3 - <<'PYRED'
          import pathlib
          text=pathlib.Path('qa-artifacts/red.tap').read_text()
          assert text.count("code: 'ERR_ASSERTION'")==3, text
          assert "expected: '目前結果 1／3'" in text
          assert "expected: '目前結果 1／1'" in text
          assert "expected: '其他案例載入中'" in text
          assert "actual: ''" in text
          PYRED
          git worktree add --detach "$RUNNER_TEMP/before-source" 8e377db
          python3 "$RUNNER_TEMP/before-source/scripts/preview.py" "$RUNNER_TEMP/before/ai-agent-use-cases"
          python3 scripts/preview.py "$RUNNER_TEMP/after/ai-agent-use-cases"
      - name: Compare baseline and updated reading journeys
        if: github.ref != 'refs/heads/verify/returning-discovery-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 -m http.server 8140 --directory "$RUNNER_TEMP/before" > /tmp/position-before.log 2>&1 &
          python3 -m http.server 8141 --directory "$RUNNER_TEMP/after" > /tmp/position-after.log 2>&1 &
          POSITION_OBSERVE=1 SITE_URL=http://127.0.0.1:8140/ai-agent-use-cases/ QA_OUT=qa-artifacts/before node tests/reader-position-browser.cjs
          QA_OUT=qa-artifacts/after node tests/reader-position-browser.cjs
      - name: Published asset match and acceptance
        if: github.ref == 'refs/heads/verify/returning-discovery-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SITE_URL: https://richardhan.github.io/ai-agent-use-cases/
          QA_OUT: qa-artifacts/published
          POSITION_LIFECYCLE: '0'
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const {isCurrentMainCommit}=require('./scripts/published-check.cjs');
          (async()=>{
          if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}for(const file of ['index.html','assets/app.js','assets/reader.css']){const response=await fetch(process.env.SITE_URL+(file==='index.html'?'':file)+'?position='+process.env.GITHUB_SHA);if(!response.ok||await response.text()!==fs.readFileSync(file,'utf8'))throw Error('Published mismatch: '+file);}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/reader-position-browser.cjs
      - name: Existing reader regression
        if: github.ref != 'refs/heads/verify/returning-discovery-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_URL: http://127.0.0.1:8141/ai-agent-use-cases/
        run: node tests/reader-browser.cjs > qa-artifacts/reader.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: returning-discovery
          path: qa-artifacts/
