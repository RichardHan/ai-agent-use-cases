name: Reader round QA
on:
  push:
    branches: [improve/reader-source-return-20261022, verify/reader-round-20261022]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit, syntax and build
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Build comparison baseline
        run: |
          git worktree add --detach "$RUNNER_TEMP/before-source" 61acdae
          python3 "$RUNNER_TEMP/before-source/scripts/preview.py" "$RUNNER_TEMP/before/ai-agent-use-cases"
      - name: List reading before and after
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 -m http.server 8150 --directory "$RUNNER_TEMP/before" > /tmp/list-before.log 2>&1 &
          python3 -m http.server 8151 --directory "$RUNNER_TEMP/preview" > /tmp/list-after.log 2>&1 &
          LIST_OBSERVE=1 SITE_URL=http://127.0.0.1:8150/ai-agent-use-cases/ QA_OUT=qa-artifacts/before node tests/markdown-lists-browser.cjs
          node tests/markdown-lists-browser.cjs
          python3 - <<'PYCOMPARE'
          import json
          before=json.load(open('qa-artifacts/before/report.json'))
          after=json.load(open('qa-artifacts/after/report.json'))
          for row in before:
              actual=next(r for r in after if r['width']==row['width'] and r['engine']==row['engine'])
              assert row['textHash']==actual['textHash'], 'Original text must remain identical'
              assert row['listCount']==actual['listCount'], 'Original list items must remain complete'
          PYCOMPARE
      - name: Existing reader regression
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_URL: http://127.0.0.1:8151/ai-agent-use-cases/
        run: node tests/reader-browser.cjs > qa-artifacts/reader.log
      - name: Live observation
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: SITE_URL=http://127.0.0.1:8151/ai-agent-use-cases/ QA_OUT=qa-artifacts/journeys node tests/round-reader-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-round
          path: qa-artifacts/
