name: Round 22 QA
on:
  push:
    branches: [verify/reader-body-published-20261022]
  workflow_dispatch:
    inputs:
      published:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit, syntax, preview and original failure
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          mkdir -p "$RUNNER_TEMP/original/tests" "$RUNNER_TEMP/original/assets"
          git show 9f5e844:assets/reader.js > "$RUNNER_TEMP/original/assets/reader.js"
          cp tests/reader-search.test.cjs "$RUNNER_TEMP/original/tests/"
          if node --test "$RUNNER_TEMP/original/tests/reader-search.test.cjs" > qa-artifacts/red.tap 2>&1; then
            echo 'Original metadata-first behavior should fail'; exit 1
          fi
          cp -R "$RUNNER_TEMP/preview" "$RUNNER_TEMP/before"
          cp "$RUNNER_TEMP/original/assets/reader.js" "$RUNNER_TEMP/before/ai-agent-use-cases/assets/reader.js"
      - name: Before and after desktop and mobile journeys
        if: github.ref != 'refs/heads/verify/reader-body-published-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 -m http.server 8131 --directory "$RUNNER_TEMP/before" > /tmp/round22-before.log 2>&1 &
          python3 -m http.server 8081 --directory "$RUNNER_TEMP/preview" > /tmp/round22-after.log 2>&1 &
          OBSERVE=1 SITE_URL=http://127.0.0.1:8131/ai-agent-use-cases/ QA_OUT=qa-artifacts/before node tests/round22-browser.cjs
          SITE_URL=http://127.0.0.1:8081/ai-agent-use-cases/ QA_OUT=qa-artifacts/after node tests/round22-browser.cjs
          READER_SEARCH_URL=http://127.0.0.1:8081/ai-agent-use-cases/ READER_SEARCH_ENGINES=all node tests/reader-search-browser.cjs
          node tests/discovery-browser.cjs > qa-artifacts/discovery.log
          READER_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/reader-browser.cjs > qa-artifacts/reader.log
      - name: Verify published behavior
        if: inputs.published || github.ref == 'refs/heads/verify/reader-body-published-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SITE_URL: https://richardhan.github.io/ai-agent-use-cases/
          QA_OUT: qa-artifacts/published
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const {isCurrentMainCommit}=require('./scripts/published-check.cjs');
          (async()=>{
          if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}const r=await fetch(process.env.SITE_URL+'assets/reader.js?round22='+process.env.GITHUB_SHA);if(!r.ok||await r.text()!==fs.readFileSync('assets/reader.js','utf8'))throw Error('Published reader differs');})();
          JS
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/round22-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round22-qa
          path: qa-artifacts/
