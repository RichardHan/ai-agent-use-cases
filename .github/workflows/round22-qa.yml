name: Round 22 QA
on:
  push:
    branches: [improve/clear-filter-context-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - run: node tests/round22-browser.cjs
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round22-qa
          path: qa-artifacts/
