name: Round 23 acceptance QA
on:
  push:
    branches: [improve/reader-tables-20261023, verify/round23-published]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts qa-artifacts
          curl -fL --max-time 90 --retry 1 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          chown -R pwuser:pwuser qa-artifacts
      - name: Observe published journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: runuser -u pwuser -- node tests/round23-observe.cjs
      - name: Observe early table reading
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SITE_URL: https://richardhan.github.io/ai-agent-use-cases/
          TABLE_ANCHOR_OBSERVE: '1'
        run: runuser -u pwuser -- node tests/table-anchor-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round23-qa
          path: qa-artifacts/
