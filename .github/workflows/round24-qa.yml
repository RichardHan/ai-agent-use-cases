name: Round 24 website QA
on:
  push:
    branches: [improve/reading-round-20261024, verify/reading-round-20261024]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts qa-artifacts
          curl -fL --max-time 90 --retry 1 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          chown -R pwuser:pwuser qa-artifacts
      - name: Checks and static preview
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --test --test-reporter=tap tests/*.test.cjs > qa-artifacts/unit.tap 2>&1
          git show 9ee0a36:assets/app.js > "$RUNNER_TEMP/before-app.js"
          if SHARE_SOURCE="$RUNNER_TEMP/before-app.js" node --test --test-reporter=tap tests/search-share-focus.test.cjs > qa-artifacts/red.tap 2>&1; then exit 1; fi
          node -e "require('node:assert/strict').match(require('node:fs').readFileSync('qa-artifacts/red.tap','utf8'), /# fail 2/);"
          for f in assets/*.js tests/search-share-focus*.cjs; do node --check "$f"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Complete sharing and existing journey regressions
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 -m http.server 8170 --directory "$RUNNER_TEMP/preview" > /tmp/round24-preview.log 2>&1 &
          export SITE_URL=http://127.0.0.1:8170/ai-agent-use-cases/
          if [ "${{ github.ref }}" = refs/heads/verify/reading-round-20261024 ]; then
            export SITE_URL=https://richardhan.github.io/ai-agent-use-cases/
            node - <<'JS'
          const fs=require('node:fs');
          (async()=>{const rows=[];for(const file of ['index.html','assets/app.js','assets/style.css','assets/reader.js','assets/reader.css']){const r=await fetch(process.env.SITE_URL+(file==='index.html'?'':file)+'?round24='+process.env.GITHUB_SHA);const data=await r.text();rows.push({file,status:r.status,bytes:Buffer.byteLength(data),matches:data===fs.readFileSync(file,'utf8')});if(!r.ok||!rows.at(-1).matches)throw Error('Published mismatch '+file);}fs.writeFileSync('qa-artifacts/published-assets.json',JSON.stringify(rows,null,2));})().catch(e=>{console.error(e);process.exit(1)});
          JS
          fi
          chown -R pwuser:pwuser qa-artifacts
          QA_OUT=qa-artifacts/after runuser -u pwuser -- node tests/search-share-focus-browser.cjs
          QA_OUT=qa-artifacts/journey runuser -u pwuser -- node tests/page-context-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: round24-qa
          path: qa-artifacts/
