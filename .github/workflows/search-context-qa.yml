name: Search context QA
on:
  push:
    branches: ['feat/search-match-context-20261018']
permissions:
  contents: read
jobs:
  context:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Existing baseline tests and build
        run: |
          node --test tests/*.test.cjs
          node --check assets/app.js
          node --check assets/reader.js
          python3 scripts/preview.py "$RUNNER_TEMP/match-preview/ai-agent-use-cases"
      - name: Install existing cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/match-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/match-tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Inspect published search
        env:
          NODE_PATH: ${{ runner.temp }}/match-tools/node_modules
        run: node tests/match-baseline.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-context-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 30
