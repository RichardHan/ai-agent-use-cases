name: Search sharing QA
on:
  push:
    branches: [improve/reader-source-access-20261024, verify/search-sharing-accessibility-20261024]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts qa-artifacts
          curl -fL --max-time 90 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          chown -R pwuser:pwuser qa-artifacts
      - name: Reproduce baseline then verify unit, syntax and build
        run: |
          git show bd9dfbe:assets/app.js > "$RUNNER_TEMP/share-before.js"
          if SHARE_SOURCE="$RUNNER_TEMP/share-before.js" node --test --test-reporter=tap tests/search-sharing.test.cjs > qa-artifacts/red.tap 2>&1; then
            echo 'Expected baseline sharing tests to fail'
            exit 1
          fi
          node --test --test-reporter=tap tests/*.test.cjs > qa-artifacts/unit.tap 2>&1
          for f in assets/*.js tests/search-sharing*.cjs; do node --check "$f"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Cloud preview sharing and visitor journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 -m http.server 8184 --directory "$RUNNER_TEMP/preview" > /tmp/sharing-preview.log 2>&1 &
          export SITE_URL=http://127.0.0.1:8184/ai-agent-use-cases/
          if [ "$GITHUB_REF_NAME" = verify/search-sharing-accessibility-20261024 ]; then
            export SITE_URL=https://richardhan.github.io/ai-agent-use-cases/
            export QA_OBSERVE=1
            node - <<'JS'
          const fs=require('node:fs');
          (async()=>{for(const file of ['index.html','assets/app.js','assets/style.css','assets/reader.js','assets/reader.css']){const r=await fetch(process.env.SITE_URL+(file==='index.html'?'':file)+'?sharing='+process.env.GITHUB_SHA);if(!r.ok||await r.text()!==fs.readFileSync(file,'utf8'))throw Error('Published asset mismatch '+file);console.log('MATCH '+file);}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          fi
          chown -R pwuser:pwuser qa-artifacts
          QA_OUT=qa-artifacts/sharing runuser -u pwuser -- node tests/search-sharing-browser.cjs
          QA_OUT=qa-artifacts/journeys runuser -u pwuser -- node tests/page-context-browser.cjs
          GUIDE_URL="$SITE_URL" runuser -u pwuser -- node tests/source-guide-share-layout.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sharing-qa
          path: qa-artifacts/
