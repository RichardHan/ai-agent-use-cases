name: Search submit QA
on:
  workflow_dispatch:
  push:
    branches: [improve/result-pagination-20261020, main]
    paths: ['tests/search-submit*', 'tests/search-scope-browser.cjs', '.github/workflows/search-submit-qa.yml', 'assets/**', 'index.html']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    # Allow the bounded publication gate and the preceding/following browser checks to finish.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tests and static build
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for file in assets/*.js; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
      - name: Cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Published baseline
        if: github.ref != 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SUBMIT_OBSERVE: '1'
          SUBMIT_OUTPUT: qa-artifacts/before
        run: node tests/search-submit-browser.cjs
      - name: Preview acceptance
        if: hashFiles('tests/search-submit.test.cjs') != ''
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SUBMIT_URL: http://127.0.0.1:8121/ai-agent-use-cases/
          SUBMIT_OUTPUT: qa-artifacts/after
          SEARCH_SCOPE_URL: http://127.0.0.1:8121/ai-agent-use-cases/
        run: |
          python3 -m http.server 8121 --directory "$RUNNER_TEMP/preview" > /tmp/submit-preview.log 2>&1 &
          node tests/search-submit-browser.cjs
          node tests/search-scope-browser.cjs
      - name: Existing reader regression
        if: hashFiles('tests/search-submit.test.cjs') != ''
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_URL: http://127.0.0.1:8121/ai-agent-use-cases/
        run: node tests/reader-browser.cjs > qa-artifacts/reader.log 2>&1 || { tail -c 5000 qa-artifacts/reader.log; exit 1; }
      - name: Published acceptance
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SUBMIT_OUTPUT: qa-artifacts/published
        run: |
          node <<'NODE'
          const {waitForPublishedAssets} = require('./scripts/published-assets.cjs');
          (async () => {
            const result = await waitForPublishedAssets({
              base: 'https://richardhan.github.io/ai-agent-use-cases/',
              sha: process.env.GITHUB_SHA,
              files: ['assets/app.js', 'assets/style.css', 'index.html']
            });
            console.log('PUBLISHED_ASSETS_' + result.toUpperCase());
          })().catch(error => { console.error(error); process.exitCode = 1; });
          NODE
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/search-submit-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-submit
          path: qa-artifacts/
