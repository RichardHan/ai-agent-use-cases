name: Sort release diagnostic
on:
  push:
    branches: ['verify/sort-release-20261020']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud tools and previews
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
          mkdir -p "$RUNNER_TEMP/before"
          git archive 32d8305 | tar -x -C "$RUNNER_TEMP/before"
          python3 "$RUNNER_TEMP/before/scripts/preview.py" "$RUNNER_TEMP/before-preview/ai-agent-use-cases"
          python3 scripts/preview.py "$RUNNER_TEMP/after-preview/ai-agent-use-cases"
          python3 -m http.server 8125 --directory "$RUNNER_TEMP/before-preview" > /tmp/before.log 2>&1 &
          python3 -m http.server 8124 --directory "$RUNNER_TEMP/after-preview" > /tmp/after.log 2>&1 &
      - name: Compare original and new WebKit native Tab with identical task flow
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node tests/sort-release-diagnostic.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sort-release-${{ github.run_id }}
          path: qa-artifacts/
