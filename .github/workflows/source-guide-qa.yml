name: Source guide QA
on:
  pull_request:
    paths: ['assets/**', 'index.html', 'cases/**', 'scripts/preview.py', 'tests/source-guide*', 'tests/reader-context-round.cjs', '.github/workflows/source-guide-qa.yml']
  push:
    branches: ['main', 'improve/evidence-discovery-20261020', 'fix/source-guide-mobile-density', 'fix/**']
    paths: ['assets/**', 'index.html', 'cases/**', 'scripts/preview.py', 'tests/source-guide*', 'tests/reader-context-round.cjs', '.github/workflows/source-guide-qa.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit tests, syntax and static preview
        run: |
          node --test tests/*.test.cjs
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/guide-preview/ai-agent-use-cases"
      - name: Install browser testing tools
        run: |
          npm install --prefix "$RUNNER_TEMP/guide-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/guide-tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Complete source-reading journeys and original regressions
        env:
          NODE_PATH: ${{ runner.temp }}/guide-tools/node_modules
          GUIDE_URL: http://127.0.0.1:8123/ai-agent-use-cases/
          CONTEXT_URL: http://127.0.0.1:8123/ai-agent-use-cases/
          BUDGET_URL: http://127.0.0.1:8123/ai-agent-use-cases/
          READER_URL: http://127.0.0.1:8123/ai-agent-use-cases/
        run: |
          python3 -m http.server 8123 --directory "$RUNNER_TEMP/guide-preview" > /tmp/guide-preview.log 2>&1 &
          python3 -m http.server 8081 --directory "$RUNNER_TEMP/guide-preview" > /tmp/guide-discovery.log 2>&1 &
          node tests/source-guide-browser.cjs
          node tests/source-guide-mobile-regression.cjs
          node tests/source-guide-share-layout.cjs
          node tests/reader-context-round.cjs
          node tests/loading-budget-browser.cjs
          node tests/discovery-browser.cjs
          node tests/reader-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-guide-preview-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 30
  published:
    if: github.ref == 'refs/heads/main'
    needs: preview
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser testing tools
        run: |
          npm install --prefix "$RUNNER_TEMP/guide-tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/guide-tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify published assets match this checkout
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          (async()=>{
            const base='https://richardhan.github.io/ai-agent-use-cases/';
            for(let attempt=0;attempt<36;attempt++){
              const matches=await Promise.all(['index.html','assets/app.js','assets/style.css'].map(async file=>{
                const response=await fetch(base+file+'?guide='+Date.now(),{cache:'no-store'});
                return response.ok&&await response.text()===fs.readFileSync(file,'utf8');
              }));
              if(matches.every(Boolean)){console.log('Published HTML, JS and CSS match checkout byte for byte');return;}
              await new Promise(resolve=>setTimeout(resolve,5000));
            }
            throw Error('Published assets did not match checkout');
          })().catch(e=>{console.error(e);process.exit(1)});
          JS
      - name: Verify the real HTTPS site on desktop and mobile
        env:
          NODE_PATH: ${{ runner.temp }}/guide-tools/node_modules
          GUIDE_URL: https://richardhan.github.io/ai-agent-use-cases/
          GUIDE_PUBLISHED: '1'
          GUIDE_OUTPUT: qa-artifacts/published-source-guide
        run: node tests/source-guide-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-guide-published-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 30
