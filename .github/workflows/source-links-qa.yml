name: Reader source links QA
on:
  push:
    branches: [improve/reader-source-links-20261021, main]
    paths: [assets/**, tests/source-links*, scripts/published-*, .github/workflows/source-links-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit, syntax and preview build
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          mkdir -p "$RUNNER_TEMP/before"
          git archive 90f400f | tar -x -C "$RUNNER_TEMP/before"
          cp tests/source-links.test.cjs "$RUNNER_TEMP/before/tests/"
          if node --test "$RUNNER_TEMP/before/tests/source-links.test.cjs" > qa-artifacts/red.tap 2>&1; then
            echo 'Expected original parser failure'; exit 1
          fi
          python3 "$RUNNER_TEMP/before/scripts/preview.py" "$RUNNER_TEMP/before-preview/ai-agent-use-cases"
          python3 -m http.server 8150 --directory "$RUNNER_TEMP/preview" > /tmp/links-preview.log 2>&1 &
          python3 -m http.server 8151 --directory "$RUNNER_TEMP/before-preview" > /tmp/links-before.log 2>&1 &
          python3 -m http.server 8081 --directory "$RUNNER_TEMP/preview" > /tmp/discovery.log 2>&1 &
      - name: Compare actual source URLs before and after
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          LINK_URL=http://127.0.0.1:8151/ai-agent-use-cases/ LINK_OBSERVE=1 LINK_OUTPUT=qa-artifacts/before node tests/source-links-browser.cjs
          LINK_URL=http://127.0.0.1:8150/ai-agent-use-cases/ LINK_OUTPUT=qa-artifacts/after node tests/source-links-browser.cjs
      - name: Search, filters, empty results, reader, failures and sharing regressions
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_URL: http://127.0.0.1:8150/ai-agent-use-cases/
          SHARE_URL: http://127.0.0.1:8150/ai-agent-use-cases/
          SHARE_OUTPUT: qa-artifacts/journeys
          SHARE_LIVE: '1'
        run: |
          node tests/discovery-browser.cjs
          node tests/reader-browser.cjs
          node tests/case-share-browser.cjs
      - name: Verify deployed assets and source journeys
        if: github.ref == 'refs/heads/main'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          LINK_OUTPUT: qa-artifacts/published
        run: |
          node - <<'JS'
          const {waitForPublishedAssets}=require('./scripts/published-assets.cjs');
          waitForPublishedAssets({
            base:'https://richardhan.github.io/ai-agent-use-cases/',
            sha:process.env.GITHUB_SHA,
            files:['index.html','assets/app.js','assets/style.css','assets/reader.js','assets/reader.css']
          }).then(result=>console.log('Publication gate: '+result)).catch(error=>{console.error(error);process.exitCode=1});
          JS
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          node tests/source-links-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-links-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
