name: Reader source links QA
on:
  push:
    branches: [improve/reader-source-links-20261021]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install cloud browser tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Walk published baseline on desktop and mobile
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SHARE_OBSERVE: '1'
          SHARE_LIVE: '1'
          SHARE_OUTPUT: qa-artifacts/baseline
        run: node tests/case-share-browser.cjs
      - name: Inspect actual nested source URLs before implementation
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          LINK_OBSERVE: '1'
          LINK_OUTPUT: qa-artifacts/links-before
        run: node tests/source-links-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-links-${{ github.run_id }}
          path: qa-artifacts/
          retention-days: 30
