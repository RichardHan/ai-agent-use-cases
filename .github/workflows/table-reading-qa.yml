name: Table reading round QA
on:
  push:
    branches: [improve/reading-access-20261023, verify/table-reading-20261023]
  workflow_dispatch:
    inputs:
      target:
        description: Browser target
        type: choice
        options: [preview, published]
        default: preview
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts
          curl -fL --max-time 90 --retry 1 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          apt-get update -qq && apt-get install -y poppler-utils
      - name: Unit, syntax and static build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          mkdir -p qa-artifacts
          node --test --test-reporter=tap tests/*.test.cjs > qa-artifacts/unit.tap 2>&1 || node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),tap=fs.readFileSync('qa-artifacts/unit.tap','utf8');
          assert.deepEqual([...tap.matchAll(/^not ok \d+ - (.+)$/gm)].map(m=>m[1]),['candidate duplicate detection normalizes URLs and identifies shared external sources without modifying corpus']);
          assert.match(tap,/expected: 19\n  actual: 21/);console.log('Only recorded baseline audit failure remains (21 vs 19)');
          JS
          for f in assets/*.js tests/table-reading*.cjs; do node --check "$f"; done
          git diff 5c9e0e1 --check
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          git show 5c9e0e1:assets/app.js > "$RUNNER_TEMP/before-app.js"
          git show 5c9e0e1:assets/reader.js > "$RUNNER_TEMP/before-reader.js"
          if TABLE_SOURCE="$RUNNER_TEMP/before-app.js" TABLE_READER="$RUNNER_TEMP/before-reader.js" node --test --test-reporter=tap tests/table-reading.test.cjs > qa-artifacts/red.tap 2>&1; then
            echo 'Expected original table regression'; exit 1
          fi
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),tap=fs.readFileSync('qa-artifacts/red.tap','utf8');assert.match(tap,/# fail 5/);assert.equal([...tap.matchAll(/code: 'ERR_ASSERTION'/g)].length,5);
          JS
      - name: Complete browser journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          QA_TARGET: ${{ inputs.target || (github.ref == 'refs/heads/verify/table-reading-20261023' && 'published') || 'preview' }}
        run: |
          python3 -m http.server 8163 --directory "$RUNNER_TEMP/preview" > /tmp/table-preview.log 2>&1 &
          export SITE_URL=http://127.0.0.1:8163/ai-agent-use-cases/
          if [ "$QA_TARGET" = published ]; then
            export SITE_URL=https://richardhan.github.io/ai-agent-use-cases/
            node - <<'JS'
          const fs=require('node:fs');
          const {isCurrentMainCommit}=require('./scripts/published-check.cjs');
          (async()=>{
          if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}for(const file of ['assets/app.js','assets/reader.js','assets/reader.css']){const r=await fetch(process.env.SITE_URL+file+'?table='+process.env.GITHUB_SHA);if(!r.ok||await r.text()!==fs.readFileSync(file,'utf8'))throw Error('Published asset mismatch '+file);}console.log('Published assets match checkout');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          fi
          chown -R pwuser:pwuser qa-artifacts
          if node -e "const {isCurrentMainCommit}=require('./scripts/published-check.cjs'); if(!isCurrentMainCommit(process.env.GITHUB_SHA)) process.exit(42)"; then
            :
          else
            freshness_status=$?
            if [ "$freshness_status" -eq 42 ]; then
              echo "SKIP_PUBLISHED_BROWSER_CHECK superseded or unverifiable main commit $GITHUB_SHA"
              exit 0
            fi
            exit "$freshness_status"
          fi
          runuser -u pwuser -- node tests/table-reading-browser.cjs
      - name: Existing discovery and reader regressions
        if: inputs.target != 'published' && github.ref != 'refs/heads/verify/table-reading-20261023'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_ENGINE: chromium
          READER_URL: http://127.0.0.1:8081/ai-agent-use-cases/
        run: |
          python3 -m http.server 8081 --directory "$RUNNER_TEMP/preview" > /tmp/table-regression.log 2>&1 &
          runuser -u pwuser -- node tests/discovery-browser.cjs > qa-artifacts/discovery.log 2>&1
          runuser -u pwuser -- node tests/reader-browser.cjs > qa-artifacts/reader.log 2>&1
      - name: Verify print text
        run: |
          pdftotext -layout qa-artifacts/after/uc400.pdf qa-artifacts/after/uc400-print.txt
          node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),text=fs.readFileSync('qa-artifacts/after/uc400-print.txt','utf8');
          for(const value of ['Mention Radar','Creator Scout','Warm Leads','Shoutout Desk','Rerun Picker','Headcount','6.50','0.20','0.45','未獨立','2111935110929174714','2112627173769310575'])assert(text.includes(value),value);
          console.log('All six bots, cost figures, caveats and both source URLs present in real PDF');
          JS
          pdftoppm -scale-to 1500 -png -f 2 -singlefile qa-artifacts/after/uc400.pdf qa-artifacts/after/uc400-print-page2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: table-reading-qa
          path: qa-artifacts/
