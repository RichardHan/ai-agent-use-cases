name: Task entry QA
on:
  push:
    branches: [improve/reader-source-disclosure-20261022, verify/task-entry-published-20261022]
  workflow_dispatch:
concurrency:
  group: task-entry-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit, syntax, static build and original failure
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          git diff --check
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          git show 2d14841:assets/app.js > "$RUNNER_TEMP/original-app.js"
          if TASK_SOURCE="$RUNNER_TEMP/original-app.js" node --test tests/task-entry.test.cjs > qa-artifacts/red.tap 2>&1; then
            echo 'Expected original status shortcut tests to fail'; exit 1
          fi
      - name: Compare baseline and task preview
        if: github.ref != 'refs/heads/verify/task-entry-published-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          git worktree add --detach "$RUNNER_TEMP/before-source" 2d14841
          python3 "$RUNNER_TEMP/before-source/scripts/preview.py" "$RUNNER_TEMP/before/ai-agent-use-cases"
          python3 -m http.server 8131 --directory "$RUNNER_TEMP/before" > /tmp/task-before.log 2>&1 &
          python3 -m http.server 8081 --directory "$RUNNER_TEMP/preview" > /tmp/task-after.log 2>&1 &
          SITE_URL=http://127.0.0.1:8131/ai-agent-use-cases/ QA_OUT=qa-artifacts/before node tests/task-entry-browser.cjs
          VERIFY_TASK=1 SITE_URL=http://127.0.0.1:8081/ai-agent-use-cases/ QA_OUT=qa-artifacts/after node tests/task-entry-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-entry-journeys
          path: qa-artifacts/
      - name: Existing discovery regression
        if: github.ref != 'refs/heads/verify/task-entry-published-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node tests/discovery-browser.cjs > qa-artifacts/discovery.log
      - name: Existing reader regression
        if: github.ref != 'refs/heads/verify/task-entry-published-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_URL: http://127.0.0.1:8081/ai-agent-use-cases/
        run: node tests/reader-browser.cjs > qa-artifacts/reader.log
      - name: Verify published improvement
        if: github.ref == 'refs/heads/verify/task-entry-published-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SITE_URL: https://richardhan.github.io/ai-agent-use-cases/
          QA_OUT: qa-artifacts/published
          VERIFY_TASK: '1'
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          (async()=>{for(const f of ['index.html','assets/app.js']){const r=await fetch(process.env.SITE_URL+(f==='index.html'?'':f)+'?task='+process.env.GITHUB_SHA);if(!r.ok||await r.text()!==fs.readFileSync(f,'utf8'))throw Error('Published asset differs: '+f);}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node tests/task-entry-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-entry-qa
          path: qa-artifacts/
