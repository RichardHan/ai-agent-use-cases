name: Task entry QA
on:
  push:
    branches: [improve/reader-source-disclosure-20261022, verify/task-entry-published-20261022]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Observe published desktop and mobile journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node tests/task-entry-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-entry-qa
          path: qa-artifacts/
