name: Search focus QA
on:
  push:
    branches: [improve/task-search-20261023, verify/search-focus-20261023]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.64.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Cloud tools
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.0 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts
          curl -fL --max-time 90 --retry 1 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          mkdir -p qa-artifacts
          chown -R pwuser:pwuser qa-artifacts
      - name: Unit, syntax and static preview
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          node --test --test-reporter=tap tests/*.test.cjs > qa-artifacts/unit.tap 2>&1 || node - <<'JS'
          const fs=require('node:fs'),assert=require('node:assert/strict'),tap=fs.readFileSync('qa-artifacts/unit.tap','utf8');
          assert.deepEqual([...tap.matchAll(/^not ok \d+ - (.+)$/gm)].map(m=>m[1]),['candidate duplicate detection normalizes URLs and identifies shared external sources without modifying corpus']);
          assert.match(tap,/expected: 19\n  actual: 23/);console.log('Recorded baseline audit failure only: 23 vs 19');
          JS
          for f in assets/*.js tests/search-focus*.cjs; do node --check "$f"; done
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          mkdir -p "$RUNNER_TEMP/baseline"
          git archive d80db401b41c82950d7b8534cb6d29190c3c8420 | tar -x -C "$RUNNER_TEMP/baseline"
          python3 "$RUNNER_TEMP/baseline/scripts/preview.py" "$RUNNER_TEMP/before/ai-agent-use-cases"
      - name: Reproduce missing focus on fixed baseline
        timeout-minutes: 5
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 -m http.server 8133 --directory "$RUNNER_TEMP/before" > /tmp/focus-before.log 2>&1 &
          export SITE_URL=http://127.0.0.1:8133/ai-agent-use-cases/
          chown -R pwuser:pwuser qa-artifacts
          QA_OUT=qa-artifacts/before FOCUS_OBSERVE=1 runuser -u pwuser -- node tests/search-focus-browser.cjs
          if QA_OUT=qa-artifacts/red runuser -u pwuser -- node tests/search-focus-browser.cjs > qa-artifacts/red.log 2>&1; then
            echo 'Expected original reader focus regression'; exit 1
          fi
          grep -q 'Keyboard focus must have a visible outline: #reader-outline-query' qa-artifacts/red.log
          if QA_OUT=qa-artifacts/recovery-red FOCUS_RECOVERY_RED=1 runuser -u pwuser -- node tests/search-focus-browser.cjs > qa-artifacts/recovery-red.log 2>&1; then
            echo 'Expected original WebKit recovery visibility failure'; exit 1
          fi
          grep -q 'Focused control must be visible: #query' qa-artifacts/recovery-red.log
      - name: Verify repaired focus and full journeys
        timeout-minutes: 7
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 -m http.server 8134 --directory "$RUNNER_TEMP/preview" > /tmp/focus-preview.log 2>&1 &
          export SITE_URL=http://127.0.0.1:8134/ai-agent-use-cases/
          if [ "${{ github.ref }}" = refs/heads/verify/search-focus-20261023 ]; then
            export SITE_URL=https://richardhan.github.io/ai-agent-use-cases/
            node - <<'JS'
          const fs=require('node:fs');
          const {isCurrentMainCommit}=require('./scripts/published-check.cjs');
          (async()=>{
          if(!isCurrentMainCommit(process.env.GITHUB_SHA)){console.log('SKIP_PUBLISHED_ASSET_CHECK superseded main commit '+process.env.GITHUB_SHA);return;}for(const file of ['index.html','assets/style.css','assets/reader.css','assets/app.js','assets/reader.js']){const r=await fetch(process.env.SITE_URL+(file==='index.html'?'':file)+'?focus='+process.env.GITHUB_SHA);if(!r.ok||await r.text()!==fs.readFileSync(file,'utf8'))throw Error('Published asset mismatch '+file);}console.log('Published product assets match checkout');})().catch(e=>{console.error(e);process.exit(1)});
          JS
          fi
          chown -R pwuser:pwuser qa-artifacts
          QA_OUT=qa-artifacts/after runuser -u pwuser -- node tests/search-focus-browser.cjs
          QA_OUT=qa-artifacts/regression runuser -u pwuser -- node tests/task-shortcuts-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: search-focus-qa
          path: qa-artifacts/
