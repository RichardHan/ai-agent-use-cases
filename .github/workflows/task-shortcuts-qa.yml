name: Task shortcuts QA
on:
  push:
    branches: [improve/task-shortcuts-20261022, verify/task-shortcuts-20261022]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - run: node --test tests/*.test.cjs
      - name: Browser journeys
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: node tests/task-shortcuts-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-shortcuts-qa
          path: qa-artifacts/
