name: Task shortcuts QA
on:
  push:
    branches: [improve/task-shortcuts-20261022, verify/task-shortcuts-20261022]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.64.1 @axe-core/playwright@4.10.2
          "$RUNNER_TEMP/tools/node_modules/.bin/playwright" install --with-deps chromium firefox webkit
          sudo apt-get install -y fonts-noto-cjk
      - name: Unit, syntax, build and original failure
        run: |
          mkdir -p qa-artifacts
          node --test tests/*.test.cjs > qa-artifacts/unit.tap
          for file in assets/*.js tests/*.cjs; do node --check "$file"; done
          git diff --check
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          git show 296cdbe:assets/app.js > "$RUNNER_TEMP/original-app.js"
          if SHORTCUT_SOURCE="$RUNNER_TEMP/original-app.js" node --test tests/task-shortcuts.test.cjs > qa-artifacts/red.tap 2>&1; then
            echo 'Expected old task handoff to fail'; exit 1
          fi
      - name: Browser journeys
        if: github.ref != 'refs/heads/verify/task-shortcuts-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
        run: |
          python3 -m http.server 8134 --directory "$RUNNER_TEMP/preview" > /tmp/shortcuts-preview.log 2>&1 &
          node tests/task-shortcuts-browser.cjs
      - name: Existing reader and search submit regressions
        if: github.ref != 'refs/heads/verify/task-shortcuts-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_URL: http://127.0.0.1:8134/ai-agent-use-cases/
          SUBMIT_URL: http://127.0.0.1:8134/ai-agent-use-cases/
        run: |
          node tests/reader-browser.cjs > qa-artifacts/reader.log
          node tests/search-submit-browser.cjs > qa-artifacts/search-submit.log
      - name: Published asset equality and journeys
        if: github.ref == 'refs/heads/verify/task-shortcuts-20261022'
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          SITE_URL: https://richardhan.github.io/ai-agent-use-cases/
          QA_OUT: qa-artifacts/published
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          (async()=>{for(const f of ['index.html','assets/app.js']){const r=await fetch(process.env.SITE_URL+(f==='index.html'?'':f)+'?shortcuts='+process.env.GITHUB_SHA);if(!r.ok||await r.text()!==fs.readFileSync(f,'utf8'))throw Error('Published asset differs: '+f);}})().catch(e=>{console.error(e);process.exit(1)});
          JS
          node tests/task-shortcuts-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: task-shortcuts-qa
          path: qa-artifacts/
