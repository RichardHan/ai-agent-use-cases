name: Isolated WebKit reader QA
on:
  push:
    branches: [improve/actionable-discovery-20261022]
    paths: [tests/reader-browser.cjs, .github/workflows/webkit-isolation-qa.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  webkit:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install matching cloud test tools
        timeout-minutes: 5
        run: |
          npm install --prefix "$RUNNER_TEMP/tools" playwright@1.56.1 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts
          curl -fL --max-time 90 --retry 1 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
      - name: Full WebKit reader in a fresh process
        env:
          NODE_PATH: ${{ runner.temp }}/tools/node_modules
          READER_URL: http://127.0.0.1:8136/ai-agent-use-cases/
          READER_ENGINE: webkit
        run: |
          node --check tests/reader-browser.cjs
          mkdir -p qa-artifacts
          python3 scripts/preview.py "$RUNNER_TEMP/preview/ai-agent-use-cases"
          python3 -m http.server 8136 --directory "$RUNNER_TEMP/preview" > /tmp/webkit-preview.log 2>&1 &
          chown -R pwuser:pwuser qa-artifacts
          runuser -u pwuser -- node tests/reader-browser.cjs > qa-artifacts/webkit-reader.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webkit-isolation-qa
          path: qa-artifacts/
