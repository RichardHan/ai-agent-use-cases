name: Website QA
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'INDEX.md'
      - 'catalog.json'
      - 'corpus.json'
      - 'audit-summary.json'
      - 'cases/**'
      - 'evidence/**'
      - 'sources/**'
      - '_config.yml'
      - 'tests/**'
      - 'scripts/**'
      - '.github/workflows/website-qa.yml'
  push:
    branches: ['main']
    paths: ['assets/**', 'index.html', 'INDEX.md', 'catalog.json', 'corpus.json', 'audit-summary.json', 'cases/**', 'evidence/**', 'sources/**', '_config.yml', 'tests/**', 'scripts/**', '.github/workflows/website-qa.yml']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tools on the GitHub runner
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" playwright@1.56.1 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts
          curl -fL --max-time 90 --retry 1 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Capture the original site
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/site-before" "$BASELINE_REF"
          python3 "$RUNNER_TEMP/site-before/scripts/preview.py" "$RUNNER_TEMP/preview-before/ai-agent-use-cases"
          python3 -m http.server 8080 --directory "$RUNNER_TEMP/preview-before" > /tmp/site-before.log 2>&1 &
          node tests/baseline-browser.cjs
          kill $!
      - name: Run existing regression tests
        run: |
          node --test tests/*.test.cjs
          node --check assets/app.js
      - name: Verify the updated site in Chromium
        if: ${{ hashFiles('tests/discovery-browser.cjs') != '' }}
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
        run: |
          python3 scripts/preview.py "$RUNNER_TEMP/preview-after/ai-agent-use-cases"
          python3 -m http.server 8081 --directory "$RUNNER_TEMP/preview-after" > /tmp/site-after.log 2>&1 &
          node tests/discovery-browser.cjs
          ROUND_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/results-batching-browser.cjs
          ROUND_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/search-submit-history-browser.cjs
      - name: Build actual Pages release for published verification
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify built Pages corpus
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: python3 scripts/check_corpus_bundle.py _site
      - name: Wait for published assets and content
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: published-version
        env:
          PUBLISHED_BUILD: ${{ runner.temp }}/website-published
        run: node tests/published-version.cjs
      - name: Verify the published GitHub Pages site
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published-version.outputs.verified == 'true' }}
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
        run: node tests/deployed-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-qa-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 14
