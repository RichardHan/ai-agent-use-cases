name: Website QA
on:
  pull_request:
    paths:
      - 'assets/**'
      - 'index.html'
      - 'INDEX.md'
      - 'README.md'
      - 'README-archive-2026-10-18.md'
      - 'templates/**'
      - 'catalog.json'
      - 'corpus.json'
      - 'audit-summary.json'
      - 'cases/**'
      - 'evidence/**'
      - 'sources/**'
      - '_config.yml'
      - 'tests/**'
      - 'scripts/**'
      # published-check.test.cjs audits every workflow file. Listing only this
      # file meant editing any other workflow started no run that reads it.
      - '.github/workflows/**'
  push:
    branches: ['main']
    paths: ['assets/**', 'index.html', 'INDEX.md', 'README.md', 'README-archive-2026-10-18.md', 'templates/**', 'catalog.json', 'corpus.json', 'audit-summary.json', 'cases/**', 'evidence/**', 'sources/**', '_config.yml', 'tests/**', 'scripts/**', '.github/workflows/**']
concurrency:
  group: website-qa-${{ github.ref }}
  # A pull request may always be replaced by its next commit. A merge may not: the
  # run waiting on the Pages deployment is the only place a failed publication is
  # reported, and cancelling it turned "the deploy failed" into a grey job
  # (run 42733562130, 2026-11-10). Keep main's verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  # Read the Pages run for this push so a finished-without-publishing deployment
  # fails the gate instead of being polled for an hour.
  actions: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    container: mcr.microsoft.com/playwright:v1.56.1-noble
    # Step 15 may spend the whole 60-minute publication window on a main push. The
    # walk that follows is now bounded at two minutes (scripts/published-revision.cjs),
    # but the job keeps the second window as setup/browser headroom: a slow
    # playwright install or a slow first page load must not run out of job time.
    timeout-minutes: 140
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA tools on the GitHub runner
        run: |
          npm install --prefix "$RUNNER_TEMP/browser-tools" playwright@1.56.1 @axe-core/playwright@4.10.2
          mkdir -p /usr/local/share/fonts
          curl -fL --max-time 90 --retry 1 https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/TraditionalChinese/NotoSansCJKtc-Regular.otf -o /usr/local/share/fonts/NotoSansCJKtc-Regular.otf
          fc-cache -f
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Capture the original site
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
          BASELINE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          git worktree add --detach "$RUNNER_TEMP/site-before" "$BASELINE_REF"
          python3 "$RUNNER_TEMP/site-before/scripts/preview.py" "$RUNNER_TEMP/preview-before/ai-agent-use-cases"
          python3 -m http.server 8080 --directory "$RUNNER_TEMP/preview-before" > /tmp/site-before.log 2>&1 &
          node tests/baseline-browser.cjs
          kill $!
      - name: Run existing regression tests
        run: |
          node --test tests/*.test.cjs
          node --check assets/app.js
      - name: Verify the updated site in Chromium
        if: ${{ hashFiles('tests/discovery-browser.cjs') != '' }}
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
        run: |
          python3 scripts/preview.py "$RUNNER_TEMP/preview-after/ai-agent-use-cases"
          python3 -m http.server 8081 --directory "$RUNNER_TEMP/preview-after" > /tmp/site-after.log 2>&1 &
          node tests/discovery-browser.cjs
          REDESIGN_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/visual-redesign-browser.cjs
          ROUND_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/results-batching-browser.cjs
          ROUND_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/search-submit-history-browser.cjs
          VERIFY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/visitor-problem-browser.cjs
          VERIFY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/mobile-problem-tags-browser.cjs
          ROUND_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/compound-split-browser.cjs
          ROUND_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/sentence-fallback-browser.cjs
          ROUND_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/search-expansion-consistency-browser.cjs
          ROUND_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/short-sentence-browser.cjs
          node tests/explore-visibility-browser.cjs
          node tests/draw-stability-browser.cjs
          ROUND_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/substring-recovery-browser.cjs
          EXPLORE_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/search-reveal-settle-browser.cjs
          KEYBOARD_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/keyboard-search-entry-browser.cjs
          VERIFY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/result-count-honesty-browser.cjs
          VERIFY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/match-scope-note-browser.cjs
          VERIFY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/search-heading-scope-browser.cjs
          DETAIL_TRUST_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/detail-trust-summary-browser.cjs
          ATTRIBUTION_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/evidence-attribution-browser.cjs
          SITE_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/publish-window-browser.cjs
          DETAIL_HISTORY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ DETAIL_HISTORY_OUTPUT=qa-artifacts/detail-close-history node tests/detail-close-history-browser.cjs
          CATEGORY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/declared-category-browser.cjs
          TARGET_USER_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/target-user-provenance-browser.cjs
          CORE_GOAL_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/core-goal-provenance-browser.cjs
          VERIFY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/task-coverage-marker-browser.cjs
          VERIFY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/scenario-reset-persistence-browser.cjs
          VERIFY_URL=http://127.0.0.1:8081/ai-agent-use-cases/ node tests/coverage-recovery-browser.cjs
      - name: Build actual Pages release for published verification
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Verify built Pages corpus
        run: python3 scripts/check_corpus_bundle.py _site
      - name: Verify language of built Pages
        run: node scripts/check-page-language.cjs _site
      - name: Verify published surface
        run: |
          node scripts/check-published-surface.cjs
          node scripts/check-published-surface.cjs _site
      - name: Verify failure recovery against built Pages index
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
          FALLBACK_URL: http://127.0.0.1:8082/ai-agent-use-cases/
        run: |
          mkdir -p "$RUNNER_TEMP/built-preview/ai-agent-use-cases"
          cp -R _site/. "$RUNNER_TEMP/built-preview/ai-agent-use-cases/"
          python3 -m http.server 8082 --directory "$RUNNER_TEMP/built-preview" > /tmp/site-built.log 2>&1 &
          node tests/index-fallback-browser.cjs
      - name: Wait for published assets and content
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        id: published-version
        env:
          PUBLISHED_BUILD: ${{ runner.temp }}/website-published
          # The only trustworthy description of what this push published.
          PUSH_BASE_SHA: ${{ github.event.before }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node tests/published-version.cjs
      - name: Fail when the published site cannot be verified
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published-version.outputs.verified != 'true' }}
        run: |
          echo "::error::The published site was not verified against $GITHUB_SHA; a green job here would claim a check that never ran."
          exit 1
      - name: Verify the published GitHub Pages site
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.published-version.outputs.verified == 'true' }}
        env:
          NODE_PATH: ${{ runner.temp }}/browser-tools/node_modules
          # Step 15 decided whether the live site is this push's build or a newer one
          # that already contains it. The walk must not re-derive that by waiting on
          # bytes: a replaced build never becomes equal again (run 42820349847).
          PUBLICATION_MODE: ${{ steps.published-version.outputs.mode }}
          PUBLICATION_LIVE_REVISION: ${{ steps.published-version.outputs.liveRevision }}
        run: node tests/deployed-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-qa-${{ github.sha }}
          path: qa-artifacts/
          retention-days: 14
